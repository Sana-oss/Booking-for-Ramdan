<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فندق كورنثيا - سجل وأرشيف الحجوزات | Corinthia Hotel - Booking Archives</title>
    
    <!-- Fonts: Playfair Display for luxury feel, Cairo for UI -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/ar.js"></script>
    
    <style>
        /* =========================================
           CORINTHIA PREMIUM DESIGN SYSTEM
           ========================================= */
        :root {
            /* Corinthia Brand Colors */
            --corinthia-maroon: #4A0E0E;
            --corinthia-dark: #1A1A1A;
            --corinthia-charcoal: #2D2D2D;
            --corinthia-gold: #D4AF37;
            --corinthia-gold-light: #E5C558;
            --corinthia-gold-dark: #B4922A;
            
            /* UI Colors */
            --success-green: #27AE60;
            --warning-orange: #E67E22;
            --danger-red: #C0392B;
            --info-blue: #2980B9;
            
            /* Backgrounds */
            --bg-primary: linear-gradient(135deg, #0D0D0D 0%, var(--corinthia-dark) 50%, var(--corinthia-charcoal) 100%);
            --bg-card: rgba(45, 45, 45, 0.8);
            --bg-card-hover: rgba(60, 60, 60, 0.9);
            
            /* Typography */
            --font-display: 'Playfair Display', serif;
            --font-body: 'Cairo', sans-serif;
            
            /* Effects */
            --gold-glow: 0 0 20px rgba(212, 175, 55, 0.3);
            --gold-border: 1px solid var(--corinthia-gold);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: var(--font-body);
            background: var(--bg-primary);
            min-height: 100vh;
            color: #f5f5f5;
            background-attachment: fixed;
        }
        
        /* =========================================
           HEADER - Premium Branding
           ========================================= */
        .page-header {
            background: linear-gradient(135deg, var(--corinthia-maroon) 0%, var(--corinthia-dark) 100%);
            padding: 0;
            border-bottom: 3px solid var(--corinthia-gold);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }
        
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 25px;
            flex-wrap: wrap;
            gap: 15px;
        }
        
        .corinthia-logo {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            flex: 1;
            min-width: 200px;
        }
        
        .logo-emblem {
            width: 55px;
            height: 55px;
            background: linear-gradient(135deg, var(--corinthia-gold) 0%, var(--corinthia-gold-dark) 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--gold-glow);
            margin-bottom: 8px;
        }
        
        .logo-emblem i {
            font-size: 1.4rem;
            color: var(--corinthia-dark);
        }
        
        .brand-title {
            font-family: var(--font-display);
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--corinthia-gold);
            letter-spacing: 2px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }
        
        .brand-subtitle {
            font-family: var(--font-display);
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.8);
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-top: 3px;
        }
        
        .header-controls {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: flex-end;
        }
        
        .language-switch {
            display: flex;
            gap: 0;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid rgba(212, 175, 55, 0.3);
        }
        
        .lang-btn {
            padding: 8px 14px;
            border: none;
            background: transparent;
            color: rgba(255, 255, 255, 0.7);
            cursor: pointer;
            font-family: var(--font-body);
            font-weight: 500;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }
        
        .lang-btn:hover {
            color: var(--corinthia-gold);
            background: rgba(212, 175, 55, 0.1);
        }
        
        .lang-btn.active {
            background: var(--corinthia-gold);
            color: var(--corinthia-dark);
            font-weight: 600;
        }
        
        .nav-btn {
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.2) 0%, rgba(212, 175, 55, 0.1) 100%);
            border: 1px solid var(--corinthia-gold);
            color: var(--corinthia-gold);
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-family: var(--font-body);
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
            white-space: nowrap;
            transition: all 0.3s ease;
        }
        
        .nav-btn:hover {
            background: var(--corinthia-gold);
            color: var(--corinthia-dark);
            box-shadow: var(--gold-glow);
        }
        
        .logout-btn {
            background: linear-gradient(135deg, var(--danger-red) 0%, #922B21 100%);
            border: none;
            color: white;
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-family: var(--font-body);
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
            transition: all 0.3s ease;
        }
        
        .logout-btn:hover {
            background: linear-gradient(135deg, #A93226 0%, #7B241C 100%);
            transform: translateY(-2px);
        }
        
        .page-description {
            background: rgba(0, 0, 0, 0.3);
            padding: 15px 30px;
            text-align: center;
            border-top: 1px solid rgba(212, 175, 55, 0.2);
        }
        
        .page-description h2 {
            font-family: var(--font-display);
            font-size: 1.3rem;
            color: var(--corinthia-gold);
            font-weight: 500;
        }
        
        .page-description p {
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.9rem;
            margin-top: 5px;
        }
        
        /* =========================================
           MAIN CONTENT
           ========================================= */
        .main-content {
            max-width: 1400px;
            margin: 0 auto;
            padding: 30px;
        }
        
        /* Stats Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: var(--bg-card);
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 12px;
            padding: 25px;
            text-align: center;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--corinthia-gold), transparent);
        }
        
        .stat-card:hover {
            transform: translateY(-5px);
            border-color: var(--corinthia-gold);
            box-shadow: var(--gold-glow);
            background: var(--bg-card-hover);
        }
        
        .stat-card .icon {
            font-size: 2.2rem;
            margin-bottom: 12px;
        }
        
        .stat-card.served .icon { color: var(--success-green); }
        .stat-card.noshow .icon { color: var(--warning-orange); }
        .stat-card.cancelled .icon { color: var(--danger-red); }
        .stat-card.expired .icon { color: rgba(255, 255, 255, 0.5); }
        
        .stat-card h3 {
            font-family: var(--font-display);
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.8);
            font-weight: 500;
            margin-bottom: 10px;
        }
        
        .stat-card .value {
            font-family: var(--font-display);
            font-size: 2.5rem;
            font-weight: 600;
            color: var(--corinthia-gold);
        }
        
        /* Filters Section */
        .filters-section {
            background: var(--bg-card);
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 12px;
            padding: 20px 25px;
            margin-bottom: 25px;
        }
        
        .filters-row {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }
        
        .search-box {
            flex: 1;
            min-width: 250px;
            position: relative;
        }
        
        .search-box input {
            width: 100%;
            padding: 12px 15px 12px 45px;
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.3);
            color: var(--corinthia-gold);  /* Gold text */
            font-family: var(--font-body);
            font-size: 0.95rem;
            text-transform: uppercase;  /* Force uppercase */
            letter-spacing: 2px;
            transition: all 0.3s ease;
        }
        
        .search-box input:focus {
            outline: none;
            border-color: var(--corinthia-gold);
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.2);
        }
        
        .search-box input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }
        
        .search-box i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--corinthia-gold);
        }
        
        .filter-select {
            padding: 12px 15px;
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.3);
            color: #fff;
            font-family: var(--font-body);
            font-size: 0.95rem;
            cursor: pointer;
            min-width: 160px;
        }
        
        .filter-select:focus {
            outline: none;
            border-color: var(--corinthia-gold);
        }
        
        .filter-select option {
            background: var(--corinthia-dark);
        }
        
        /* Date Filter Group */
        .date-filter-group {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        
        .filter-input {
            padding: 12px 15px;
            border-radius: 8px;
            border: 1px solid var(--corinthia-gold);
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            font-family: 'Cairo', sans-serif;
            font-size: 0.9rem;
            min-width: 140px;
        }
        
        .filter-input:focus {
            outline: none;
            border-color: var(--corinthia-gold-light);
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.3);
        }
        
        .filter-input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }
        
        /* Date Range Input Styling */
        .date-range-input {
            height: 45px !important;
            padding: 0 15px !important;
            border: 1px solid rgba(212, 175, 55, 0.4) !important;
            background: rgba(255, 255, 255, 0.05) !important;
            color: white !important;
            border-radius: 8px !important;
            min-width: 200px;
        }
        
        .search-bar-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .btn-clear {
            padding: 10px 14px;
            margin-right: 8px;
            border-radius: 8px;
            border: none;
            background: transparent;
            color: #d4af37;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .btn-clear:hover {
            background: rgba(212, 175, 55, 0.15);
            transform: scale(1.1);
        }
        
        .btn-clear i {
            font-size: 0.9rem;
        }
        
        .export-btn {
            background: linear-gradient(135deg, var(--corinthia-gold) 0%, var(--corinthia-gold-dark) 100%);
            color: var(--corinthia-dark);
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-family: var(--font-body);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
        }
        
        .export-btn:hover {
            background: linear-gradient(135deg, var(--corinthia-gold-light) 0%, var(--corinthia-gold) 100%);
            box-shadow: var(--gold-glow);
            transform: translateY(-2px);
        }
        
        /* =========================================
           FLATPICKR CALENDAR THEME
           ========================================= */
        .flatpickr-calendar {
            background: #2d2d2d;
            border-top: 3px solid var(--corinthia-gold);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border-radius: 12px;
        }
        
        .flatpickr-months {
            background: linear-gradient(135deg, var(--corinthia-maroon) 0%, var(--corinthia-dark) 100%);
            border-radius: 12px 12px 0 0;
        }
        
        .flatpickr-months .flatpickr-month {
            color: #fff;
            fill: #fff;
        }
        
        .flatpickr-weekday {
            background: rgba(212, 175, 55, 0.1);
            color: var(--corinthia-gold);
            font-weight: 600;
        }
        
        .flatpickr-day {
            color: #f5f5f5;
            border-color: rgba(212, 175, 55, 0.2);
        }
        
        .flatpickr-day:hover {
            background: rgba(212, 175, 55, 0.2);
        }
        
        .flatpickr-day.selected {
            background: var(--corinthia-gold) !important;
            border-color: var(--corinthia-gold) !important;
            color: var(--corinthia-dark) !important;
        }
        
        .flatpickr-day.inRange {
            background: rgba(212, 175, 55, 0.3) !important;
            border-color: rgba(212, 175, 55, 0.3) !important;
            color: #fff !important;
            box-shadow: -5px 0 0 rgba(212, 175, 55, 0.3), 5px 0 0 rgba(212, 175, 55, 0.3);
        }
        
        .flatpickr-day.startRange, .flatpickr-day.endRange {
            background: var(--corinthia-gold) !important;
            border-color: var(--corinthia-gold) !important;
            color: var(--corinthia-dark) !important;
        }
        
        .flatpickr-current-month .flatpickr-monthDropdown-months {
            background: transparent;
            color: #fff;
        }
        
        .flatpickr-current-month input.cur-year {
            color: #fff;
        }
        
        .numInputWrapper:hover {
            background: rgba(212, 175, 55, 0.1);
        }
        
        /* =========================================
           PREMIUM TABLE DESIGN
           ========================================= */
        .table-container {
            background: var(--bg-card);
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 12px;
            overflow: hidden;
        }
        
        .archive-table {
            width: 100%;
            border-collapse: collapse;
        }
        
        .archive-table thead {
            background: linear-gradient(135deg, var(--corinthia-maroon) 0%, var(--corinthia-dark) 100%);
        }
        
        .archive-table th {
            padding: 18px 15px;
            text-align: center;
            font-family: var(--font-display);
            font-weight: 600;
            font-size: 0.95rem;
            color: var(--corinthia-gold);
            letter-spacing: 0.5px;
            border-bottom: 2px solid var(--corinthia-gold);
        }
        
        .archive-table tbody tr {
            transition: all 0.3s ease;
            border-bottom: 1px solid rgba(212, 175, 55, 0.1);
        }
        
        .archive-table tbody tr:hover {
            background: rgba(212, 175, 55, 0.08);
            border-left: 3px solid var(--corinthia-gold);
        }
        
        .archive-table td {
            padding: 15px;
            text-align: center;
            font-size: 0.9rem;
        }
        
        .ref-cell {
            font-family: monospace;
            font-weight: 600;
            color: var(--corinthia-gold);
            letter-spacing: 1px;
        }
        
        .guest-info {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }
        
        .guest-info .name {
            font-weight: 600;
            color: #fff;
        }
        
        .guest-info .phone {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.5);
        }
        
        .date-cell, .archived-date {
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.85rem;
        }
        
        /* Status Badges */
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 500;
        }
        
        .badge-arrived {
            background: rgba(39, 174, 96, 0.2);
            color: var(--success-green);
            border: 1px solid var(--success-green);
        }
        
        .badge-noshow {
            background: rgba(230, 126, 34, 0.2);
            color: var(--warning-orange);
            border: 1px solid var(--warning-orange);
        }
        
        .badge-cancelled {
            background: rgba(192, 57, 43, 0.2);
            color: var(--danger-red);
            border: 1px solid var(--danger-red);
        }
        
        .badge-expired {
            background: rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .badge-default {
            background: rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        
        .badge-pending {
            background: rgba(212, 175, 55, 0.2);
            color: var(--corinthia-gold);
            border: 1px solid var(--corinthia-gold);
        }
        
        /* Center-aligned table cells */
        .archive-table th,
        .archive-table td {
            text-align: center;
            vertical-align: middle;
        }
        
        .archive-table .ref-cell,
        .archive-table .guests-cell,
        .archive-table .status-cell,
        .archive-table .archived-date-cell,
        .archive-table .performed-by-cell,
        .archive-table .actions-cell {
            text-align: center;
        }
        
        .ref-number {
            font-weight: 600;
            color: var(--corinthia-gold);
            font-family: monospace;
        }
        
        .guests-count {
            background: rgba(212, 175, 55, 0.2);
            padding: 4px 10px;
            border-radius: 12px;
            font-weight: 600;
            color: var(--corinthia-gold);
        }
        
        .admin-name {
            color: var(--corinthia-gold);
            font-weight: 500;
        }
        
        .date-na {
            color: rgba(255, 255, 255, 0.4);
            font-style: italic;
        }
        
        /* Restore Button - Premium Style */
        .btn-restore {
            background: linear-gradient(135deg, var(--success-green) 0%, #219A52 100%);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-family: var(--font-body);
            font-size: 0.85rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.3s ease;
            box-shadow: 0 3px 10px rgba(39, 174, 96, 0.3);
        }
        
        .btn-restore:hover {
            background: linear-gradient(135deg, #2ECC71 0%, var(--success-green) 100%);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(39, 174, 96, 0.4);
        }
        
        .btn-restore i {
            font-size: 0.9rem;
        }
        
        .actions-cell {
            white-space: nowrap;
        }
        
        .performed-by-cell {
            font-size: 0.85rem;
            color: var(--corinthia-gold);
            font-weight: 500;
        }
        
        /* Empty/Loading States */
        .empty-state, .loading-state {
            padding: 60px 20px;
            text-align: center;
            color: rgba(255, 255, 255, 0.5);
        }
        
        .empty-state i, .loading-state i {
            font-size: 3rem;
            margin-bottom: 15px;
            color: var(--corinthia-gold);
        }
        
        .empty-state p, .loading-state p {
            font-family: var(--font-display);
            font-size: 1.1rem;
        }
        
        /* Pagination */
        .pagination {
            display: flex;
            justify-content: center;
            gap: 8px;
            padding: 20px;
            background: rgba(0, 0, 0, 0.2);
            border-top: 1px solid rgba(212, 175, 55, 0.1);
        }
        
        .pagination button {
            background: rgba(212, 175, 55, 0.1);
            border: 1px solid rgba(212, 175, 55, 0.3);
            color: var(--corinthia-gold);
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-family: var(--font-body);
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }
        
        .pagination button:hover:not(:disabled) {
            background: var(--corinthia-gold);
            color: var(--corinthia-dark);
        }
        
        .pagination button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        
        .pagination button.active {
            background: var(--corinthia-gold);
            color: var(--corinthia-dark);
            font-weight: bold;
        }
        
        /* Toast Notifications */
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            padding: 15px 25px;
            border-radius: 10px;
            color: white;
            font-weight: 500;
            z-index: 10000;
            animation: slideIn 0.3s ease;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.4);
            font-family: var(--font-body);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .toast.success {
            background: linear-gradient(135deg, var(--success-green) 0%, #219A52 100%);
            border: 1px solid #2ECC71;
        }
        
        .toast.error {
            background: linear-gradient(135deg, var(--danger-red) 0%, #922B21 100%);
            border: 1px solid #E74C3C;
        }
        
        .toast.info {
            background: linear-gradient(135deg, var(--info-blue) 0%, #1A5276 100%);
            border: 1px solid #3498DB;
        }
        
        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

    <script src="constants.js"></script>

    <script>
        // API_BASE compatibility (using constants.js)
        const API_BASE = CONSTANTS.API.BASE || '';
        
        // Debug: Log API_BASE to help troubleshoot URL issues
        console.log('🔗 Archives Page - API_BASE:', API_BASE);
        console.log('🔗 Archives Page - ARCHIVES.LIST:', CONSTANTS.API.ARCHIVES?.LIST || 'Not defined');
        
        // =========================================
        // LANGUAGE SWITCHER
        // =========================================
        let currentLanguage = 'ar';
        
        function setLanguage(lang) {
            currentLanguage = lang;
            
            // Update HTML attributes
            document.documentElement.lang = lang;
            document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
            
            // Update language buttons
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.lang === lang);
            });
            
            // Update text content for elements with data attributes
            updateTextContent();
            
            // Update placeholders
            updatePlaceholders();
            
            // Save preference
            localStorage.setItem('archiveLang', lang);
        }
        
        function updateTextContent() {
            // Update elements with data-ar/data-en attributes
            document.querySelectorAll('[data-ar][data-en]').forEach(el => {
                const key = currentLanguage === 'ar' ? 'data-ar' : 'data-en';
                if (el.tagName === 'INPUT' || el.tagName === 'SELECT') {
                    // Skip input/select elements for text content
                } else {
                    el.textContent = el.getAttribute(key);
                }
            });
            
            // Update button text
            document.querySelectorAll('.btn-text').forEach(btn => {
                btn.textContent = btn.getAttribute('data-' + currentLanguage);
            });
        }
        
        function updatePlaceholders() {
            document.querySelectorAll('.search-field').forEach(input => {
                input.placeholder = input.getAttribute('data-placeholder-' + currentLanguage);
            });
        }
        
        // Initialize language
        function initLanguage() {
            const savedLang = localStorage.getItem('archiveLang') || 'ar';
            setLanguage(savedLang);
        }
        
        // =========================================
        // AUTH & SECURITY
        // =========================================
        function checkAuth() {
            const token = localStorage.getItem('adminToken');
            const adminUser = localStorage.getItem('adminUser');
            
            if (!token || !adminUser) {
                window.location.href = 'admin-login.html';
                return false;
            }
            return true;
        }
        
        if (!checkAuth()) {
            throw new Error('Unauthorized - Redirecting to login');
        }
        
        function logout() {
            localStorage.removeItem('adminToken');
            localStorage.removeItem('adminUser');
            window.location.href = 'admin-login.html';
        }
        
        // =========================================
        // DATA MANAGEMENT
        // =========================================
        let archivesData = [];
        let totalPages = 1;
        let currentPage = 1;
        let archiveStats = { arrived: 0, noShow: 0, cancelled: 0, expired: 0 };
        
        // Load archive stats
        async function loadArchiveStats() {
            try {
                const token = localStorage.getItem('adminToken');
                const headers = { 'Content-Type': 'application/json' };
                if (token) headers['Authorization'] = 'Bearer ' + token;
                
                const response = await fetch(API_BASE + '/bookings/archive/stats', { headers: headers });
                const result = await response.json();
                
                if (result.success) {
                    archiveStats = {
                        arrived: result.data.Arrived?.count || 0,
                        noShow: result.data['No-Show']?.count || 0,
                        cancelled: result.data.Cancelled?.count || 0,
                        expired: result.data.Expired?.count || 0
                    };
                    updateStatsDisplay();
                }
            } catch (error) {
                console.error('Error loading archive stats:', error);
            }
        }
        
        function updateStatsDisplay() {
            document.getElementById('servedCount').textContent = archiveStats.arrived || 0;
            document.getElementById('noShowCount').textContent = archiveStats.noShow || 0;
            document.getElementById('cancelledCount').textContent = archiveStats.cancelled || 0;
            document.getElementById('expiredCount').textContent = archiveStats.expired || 0;
        }
        
        // Store full data for client-side filtering
        let fullArchivesData = [];
        const ITEMS_PER_PAGE = 50;
        
        // Initialize Flatpickr for archives (no minDate restriction for past dates)
        document.addEventListener('DOMContentLoaded', () => {
            const archiveRangePicker = document.getElementById('archiveRangePicker');
            
            // Get current language
            const currentLang = localStorage.getItem('hotel_lang') || 'ar';
            
            // Set locale based on language
            const locale = currentLang === 'en' ? flatpickr.l10ns.en : flatpickr.l10ns.ar;
            
            if (archiveRangePicker) {
                flatpickr("#archiveRangePicker", {
                    mode: "range",
                    dateFormat: "Y-m-d",
                    locale: locale,
                    defaultDate: null,
                    onChange: function(selectedDates) {
                        if (selectedDates.length === 2) {
                            applyFilters(selectedDates[0], selectedDates[1]);
                        } else if (selectedDates.length === 0) {
                            applyFilters(null, null);
                        }
                    }
                });
            }
        });
        
        // Clear date filters
        function clearDateFilters() {
            const archiveRangePicker = document.getElementById('archiveRangePicker');
            if (archiveRangePicker && archiveRangePicker._flatpickr) {
                archiveRangePicker._flatpickr.clear();
            }
            applyFilters(null, null);
        }
        
        // Apply filters to full data (search + status + date range)
        function applyFilters(startDateParam = null, endDateParam = null) {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase().trim();
            const selectedStatus = document.getElementById('reasonFilter').value;
            
            // Use provided dates or default to null
            const startDate = startDateParam;
            const endDate = endDateParam;
            
            const filteredData = fullArchivesData.filter(booking => {
                const status = booking.status || booking.archiveReason || '';
                
                // Check status match (must match exactly, or show all if empty)
                const matchesStatus = !selectedStatus || status === selectedStatus;
                
                // Check search match (name, phone, or reference)
                const guestName = booking.name || (booking.firstName && booking.lastName ? booking.firstName + ' ' + booking.lastName : booking.firstName || booking.lastName || '');
                const matchesSearch = !searchTerm || 
                    guestName.toLowerCase().includes(searchTerm) ||
                    (booking.phone && booking.phone.includes(searchTerm)) ||
                    (booking.referenceNumber && booking.referenceNumber.toLowerCase().includes(searchTerm));
                
                // Check date range match with proper normalization
                let matchesDateRange = true;
                if (startDate || endDate) {
                    const bookingDate = new Date(booking.date || booking.createdAt || booking.archivedAt);
                    bookingDate.setHours(0, 0, 0, 0); // Normalize to start of day
                    
                    if (startDate) {
                        const start = new Date(startDate);
                        start.setHours(0, 0, 0, 0); // Normalize to start of day
                        matchesDateRange = matchesDateRange && bookingDate.getTime() >= start.getTime();
                    }
                    if (endDate) {
                        const end = new Date(endDate);
                        end.setHours(23, 59, 59, 999); // End of day
                        matchesDateRange = matchesDateRange && bookingDate.getTime() <= end.getTime();
                    }
                }
                
                return matchesStatus && matchesSearch && matchesDateRange;
            });
            
            // Sort and paginate filtered data
            filteredData.sort((a, b) => new Date(b.createdAt || b.archivedAt) - new Date(a.createdAt || a.archivedAt));
            
            currentPage = 1;
            const start = 0;
            const paginatedData = filteredData.slice(start, ITEMS_PER_PAGE);
            
            archivesData = filteredData;
            totalPages = Math.ceil(filteredData.length / ITEMS_PER_PAGE);
            renderTable(paginatedData);
            renderPagination();
            
            console.log('Filters applied:', { searchTerm, selectedStatus, totalResults: filteredData.length });
        }
        
        // Calculate stats from combined data (live calculation)
        function updateStatCardsFromData(data) {
            const stats = {
                served: 0,
                noShow: 0,
                cancelled: 0,
                expired: 0
            };
            
            data.forEach(item => {
                const status = item.status || item.archiveReason || '';
                switch (status) {
                    case 'Confirmed':
                    case 'Arrived':
                        stats.served++;
                        break;
                    case 'No Show':
                    case 'No-Show':
                        stats.noShow++;
                        break;
                    case 'Cancelled':
                        stats.cancelled++;
                        break;
                    case 'Expired':
                        stats.expired++;
                        break;
                    default:
                        // Log unknown status for debugging
                        console.log('Unknown status:', status, 'for item:', item.referenceNumber);
                }
            });
            
            // Debug: Log all unique statuses found in data
            const uniqueStatuses = [...new Set(data.map(item => item.status || item.archiveReason || 'undefined'))];
            console.log('Unique statuses in data:', uniqueStatuses);
            console.log('Calculated stats:', stats);
            
            // Update DOM elements with correct IDs (matching HTML)
            if(document.getElementById('servedCount'))
                document.getElementById('servedCount').innerText = stats.served;
            if(document.getElementById('noShowCount'))
                document.getElementById('noShowCount').innerText = stats.noShow;
            if(document.getElementById('cancelledCount'))
                document.getElementById('cancelledCount').innerText = stats.cancelled;
            if(document.getElementById('expiredCount'))
                document.getElementById('expiredCount').innerText = stats.expired;
            
            console.log('Stats Force-Updated:', stats);
        }
        
        // Load archives from both BookingArchive collection and main Booking collection
        async function loadArchives() {
            const search = document.getElementById('searchInput').value;
            const reason = document.getElementById('reasonFilter').value;
            
            try {
                const token = localStorage.getItem('adminToken');
                const headers = { 'Content-Type': 'application/json' };
                if (token) headers['Authorization'] = 'Bearer ' + token;
                
                console.log('📥 Loading archives from:', API_BASE);
                
                // First, fetch ALL data without filters for accurate stats calculation
                // Note: API_BASE already includes /api, so use relative path
                const archiveUrlAll = API_BASE + '/bookings/archive?page=1&limit=1000';
                console.log('📥 Fetching from archive collection:', archiveUrlAll);
                const archiveResponseAll = await fetch(archiveUrlAll, { headers: headers });
                const archiveResultAll = await archiveResponseAll.json();
                console.log('📊 Archive collection result:', archiveResultAll);
                
                // Use constants.js endpoint for admin archived bookings (already includes /api)
                const adminUrlAll = CONSTANTS.API.ARCHIVES?.LIST || (API_BASE + '/admin/archived-bookings');
                console.log('📥 Fetching from admin endpoint:', adminUrlAll);
                const adminResponseAll = await fetch(adminUrlAll, { headers: headers });
                
                // Check for auth errors
                if (adminResponseAll.status === 401) {
                    console.error('❌ Unauthorized - redirecting to login');
                    localStorage.removeItem('adminToken');
                    localStorage.removeItem('adminUser');
                    window.location.href = 'admin-login.html';
                    return;
                }
                
                const adminResultAll = await adminResponseAll.json();
                console.log('📊 Admin archived bookings result:', adminResultAll);
                
                // Combine ALL data for stats calculation
                let allDataForStats = [];
                if (archiveResultAll.success) {
                    allDataForStats = [...archiveResultAll.data];
                }
                if (adminResultAll.success) {
                    const adminBookings = adminResultAll.data.map(b => ({ ...b, _source: 'main' }));
                    allDataForStats = [...allDataForStats, ...adminBookings];
                }
                
                // Update stat cards with total counts (不受搜索影响)
                updateStatCardsFromData(allDataForStats);
                
                // Store full data for client-side filtering
                fullArchivesData = allDataForStats;
                
                // Apply filters and render table (client-side filtering)
                applyFilters();
                
                // FORCE UPDATE STATS at the absolute end (after all rendering)
                setTimeout(() => {
                    updateStatCardsFromData(fullArchivesData);
                    console.log('Stats Force-Updated to:', {
                        served: allDataForStats.filter(b => b.status === 'Confirmed').length,
                        noShow: allDataForStats.filter(b => b.status === 'No Show' || b.status === 'No-Show').length,
                        cancelled: allDataForStats.filter(b => b.status === 'Cancelled').length,
                        expired: allDataForStats.filter(b => b.status === 'Expired').length
                    });
                }, 500);
            } catch (error) {
                console.error('Error loading archives:', error);
                const emptyMsg = currentLanguage === 'ar' ? 'لا توجد سجلات في الأرشيف' : 'No archive records found';
                document.getElementById('archiveTableBody').innerHTML = '<tr><td colspan="8" class="empty-state"><i class="fas fa-exclamation-triangle"></i><p>' + emptyMsg + '</p></td></tr>';
            }
        }
        
        // Render table
        function renderTable(data) {
            const tbody = document.getElementById('archiveTableBody');
            
            const emptyMsg = currentLanguage === 'ar' ? 'لا توجد سجلات في الأرشيف' : 'No archive records found';
            const errorMsg = currentLanguage === 'ar' ? 'حدث خطأ في تحميل البيانات' : 'Error loading data';
            
            if (!data || data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8" class="empty-state"><i class="fas fa-folder-open"></i><p>' + emptyMsg + '</p></td></tr>';
                return;
            }
            
            let html = '';
            const restoreText = currentLanguage === 'ar' ? 'استعادة' : 'Restore';
            const restoreIcon = currentLanguage === 'ar' ? 'fa-undo' : 'fa-rotate-left';
            
            for (let i = 0; i < data.length; i++) {
                const archive = data[i];
                
                // Determine status from different possible fields
                const status = archive.status || archive.archiveReason || 'Cancelled';
                
                // Determine archived date from different possible fields
                const archivedDate = archive.archivedAt || archive.updatedAt || archive.cancelledAt || archive.createdAt;
                
                // Determine who archived it
                const archivedBy = archive.archivedBy || archive.cancelledBy || archive.updatedBy || 'System';
                
                html += '<tr>';
                html += '<td class="ref-cell"><span class="ref-number">' + escapeHtml(archive.referenceNumber || 'N/A') + '</span></td>';
                
                // Guest name - handle both formats
                const guestName = archive.name || (archive.firstName && archive.lastName ? archive.firstName + ' ' + archive.lastName : archive.firstName || archive.lastName || 'N/A');
                html += '<td><div class="guest-info"><span class="name">' + escapeHtml(guestName) + '</span><span class="phone">' + escapeHtml(archive.phone || '') + '</span></div></td>';
                
                html += '<td class="date-cell">' + formatDate(archive.date) + '</td>';
                html += '<td class="guests-cell"><span class="guests-count">' + (archive.guests || archive.numberOfSeats || 1) + '</span></td>';
                html += '<td class="status-cell">' + getStatusBadge(status) + '</td>';
                html += '<td class="archived-date-cell">' + formatDateTime(archivedDate) + '</td>';
                html += '<td class="performed-by-cell"><span class="admin-name">' + escapeHtml(archivedBy) + '</span></td>';
                html += '<td class="actions-cell"><button class="btn-restore" onclick="restoreBooking(\'' + archive._id + '\')"><i class="fas ' + restoreIcon + '"></i> ' + restoreText + '</button></td>';
                html += '</tr>';
            }
            tbody.innerHTML = html;
        }
        
        // Get status badge HTML (handles both status and archiveReason)
        function getStatusBadge(status) {
            const iconMap = {
                'Arrived': 'fa-check-circle',
                'No-Show': 'fa-user-times',
                'No Show': 'fa-user-times',
                'Cancelled': 'fa-times-circle',
                'Expired': 'fa-clock',
                'Pending': 'fa-hourglass-half',
                'Confirmed': 'fa-check',
                'Rejected': 'fa-ban'
            };
            const classMap = {
                'Arrived': 'badge-arrived',
                'No-Show': 'badge-noshow',
                'No Show': 'badge-noshow',
                'Cancelled': 'badge-cancelled',
                'Expired': 'badge-expired',
                'Pending': 'badge-pending',
                'Confirmed': 'badge-confirmed',
                'Rejected': 'badge-cancelled'
            };
            const icon = iconMap[status] || 'fa-circle';
            const badgeClass = classMap[status] || 'badge-default';
            const text = i18n.tStatus(status);
            return '<span class="badge ' + badgeClass + '"><i class="fas ' + icon + '"></i> ' + escapeHtml(text) + '</span>';
        }
        
        // Format date with fallback for invalid dates
        function formatDate(dateStr) {
            if (!dateStr) return '<span class="date-na">N/A</span>';
            const date = new Date(dateStr);
            if (isNaN(date.getTime())) return '<span class="date-na">N/A</span>';
            const options = currentLanguage === 'ar' 
                ? { year: 'numeric', month: 'long', day: 'numeric' }
                : { year: 'numeric', month: 'short', day: 'numeric' };
            return date.toLocaleDateString(currentLanguage === 'ar' ? 'ar-EG' : 'en-US', options);
        }
        
        // Format date with time (YYYY-MM-DD | HH:mm) - handles invalid dates
        function formatDateTime(dateStr) {
            if (!dateStr) return '<span class="date-na">N/A</span>';
            const date = new Date(dateStr);
            if (isNaN(date.getTime())) return '<span class="date-na">N/A</span>';
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            const hours = String(date.getHours()).padStart(2, '0');
            const minutes = String(date.getMinutes()).padStart(2, '0');
            return year + '-' + month + '-' + day + ' | ' + hours + ':' + minutes;
        }
        
        // Escape HTML to prevent XSS
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        // Format time for Excel (HH:mm:ss)
        function formatTimeForExcel(dateStr) {
            const date = new Date(dateStr);
            const hours = String(date.getHours()).padStart(2, '0');
            const minutes = String(date.getMinutes()).padStart(2, '0');
            const seconds = String(date.getSeconds()).padStart(2, '0');
            return hours + ':' + minutes + ':' + seconds;
        }
        
        // Render pagination
        function renderPagination() {
            const pagination = document.getElementById('pagination');
            
            if (totalPages <= 1) {
                pagination.innerHTML = '';
                return;
            }
            
            let html = '';
            const prevText = currentLanguage === 'ar' ? '<i class="fas fa-chevron-right"></i>' : '<i class="fas fa-chevron-left"></i>';
            const nextText = currentLanguage === 'ar' ? '<i class="fas fa-chevron-left"></i>' : '<i class="fas fa-chevron-right"></i>';
            
            html += '<button' + (currentPage === 1 ? ' disabled' : '') + ' onclick="goToPage(' + (currentPage - 1) + ')">' + prevText + '</button>';
            
            for (let i = 1; i <= totalPages; i++) {
                if (i === 1 || i === totalPages || (i >= currentPage - 2 && i <= currentPage + 2)) {
                    html += '<button class="' + (i === currentPage ? 'active' : '') + '" onclick="goToPage(' + i + ')">' + i + '</button>';
                } else if (i === currentPage - 3 || i === currentPage + 3) {
                    html += '<button disabled>...</button>';
                }
            }
            
            html += '<button' + (currentPage === totalPages ? ' disabled' : '') + ' onclick="goToPage(' + (currentPage + 1) + ')">' + nextText + '</button>';
            
            pagination.innerHTML = html;
        }
        
        // Go to page (client-side pagination)
        function goToPage(page) {
            currentPage = page;
            
            // Paginate the already-filtered archivesData
            const start = (currentPage - 1) * ITEMS_PER_PAGE;
            const paginatedData = archivesData.slice(start, start + ITEMS_PER_PAGE);
            
            renderTable(paginatedData);
            renderPagination();
            
            // Scroll to top of table
            document.getElementById('archiveTableBody')?.scrollIntoView({ behavior: 'smooth' });
        }
        
        // Handle search
        let searchTimeout;
        
        /**
         * Clean Archive Search - Strict 8 character alphanumeric uppercase
         */
        function cleanArchiveSearch(input) {
            let value = input.value.toUpperCase();
            value = value.replace(/[^A-Z0-9\-]/g, '');
            if (value.length > 10) {
                value = value.slice(0, 10);
            }
            input.value = value;
            handleSearch();
        }
        
        function handleSearch() {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(function() {
                applyFilters();
            }, 300);
        }
        
        // Export to Excel
        function exportToExcel() {
            const table = document.querySelector("#archivesTable");
            if (!table) return;
            
            let html = table.outerHTML;
            // Clean up HTML (remove action buttons or icons if they exist in the export)
            html = html.replace(/<button\b[^>]*>([\s\S]*?)<\/button>/gi, "");
            html = html.replace(/<i\b[^>]*>([\s\S]*?)<\/i>/gi, "");
            
            const url = 'data:application/vnd.ms-excel;base64,' + btoa(unescape(encodeURIComponent(html)));
            const link = document.createElement('a');
            link.href = url;
            
            // Filename with current date
            const date = new Date().toISOString().slice(0, 10);
            link.download = `Corinthia_Ramadan_Archives_${date}.xls`;
            
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
        
        // Toast notification
        function showToast(message, type) {
            type = type || 'info';
            
            const existingToast = document.querySelector('.toast');
            if (existingToast) {
                existingToast.remove();
            }
            
            const toast = document.createElement('div');
            toast.className = 'toast ' + type;
            const icon = type === 'success' ? 'fa-check-circle' : type === 'error' ? 'fa-times-circle' : 'fa-info-circle';
            toast.innerHTML = '<i class="fas ' + icon + '"></i> ' + message;
            document.body.appendChild(toast);
            
            setTimeout(function() {
                toast.style.animation = 'slideIn 0.3s ease reverse';
                setTimeout(function() { toast.remove(); }, 300);
            }, 3000);
        }
        
        // Restore booking
        async function restoreBooking(id) {
            const confirmMsg = currentLanguage === 'ar' 
                ? 'هل أنت متأكد من استعادة هذا الحجز من الأرشيف؟\nسيتم نقله إلى الحجوزات النشطة.'
                : 'Are you sure you want to restore this booking from archive?\nIt will be moved back to active bookings.';
            
            if (!confirm(confirmMsg)) return;
            
            try {
                const token = localStorage.getItem('adminToken');
                const response = await fetch(CONSTANTS.API.ARCHIVES.RESTORE(id), {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + token
                    }
                });
                
                const result = await response.json();
                
                if (result.success) {
                    const successMsg = currentLanguage === 'ar' ? 'تم استعادة الحجز بنجاح!' : 'Booking restored successfully!';
                    showToast(successMsg, 'success');
                    loadArchives();
                    loadArchiveStats();
                } else {
                    const errorMsg = currentLanguage === 'ar' ? 'فشل في الاستعادة: ' : 'Restore failed: ';
                    showToast(errorMsg + result.message, 'error');
                }
            } catch (error) {
                console.error('Restore error:', error);
                const errorMsg = currentLanguage === 'ar' ? 'حدث خطأ أثناء الاستعادة' : 'Error during restore';
                showToast(errorMsg, 'error');
            }
        }
        
        // =========================================
        // INITIALIZE
        // =========================================
        document.addEventListener('DOMContentLoaded', function() {
            initLanguage();
            // loadArchives() already calculates stats from combined data
            // No need for separate loadArchiveStats() call
            loadArchives();
        });
    </script>
</body>
</html>
