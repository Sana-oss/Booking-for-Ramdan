<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فندق كورنثيا - سجل وأرشيف الحجوزات | Corinthia Hotel - Booking Archives</title>
    
    <!-- Fonts: Playfair Display for luxury feel, Cairo for UI -->
    <link rel="stylesheet" href="vendor/fonts/fonts.css">
    <link rel="stylesheet" href="vendor/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="vendor/flatpickr/flatpickr.min.css">
    <script src="vendor/xlsx/xlsx.full.min.js"></script>
    <script src="vendor/flatpickr/flatpickr.min.js"></script>
    <script src="vendor/flatpickr/l10n/ar.js"></script>
    
    <style>
        /* =========================================
           CORINTHIA PREMIUM DESIGN SYSTEM
           ========================================= */
        :root {
            /* Corinthia Brand Colors */
            --corinthia-maroon: #4A0E0E;
            --corinthia-dark: #1A1A1A;
            --corinthia-charcoal: #2D2D2D;
            --corinthia-gold: #D4AF37;
            --corinthia-gold-light: #E5C558;
            --corinthia-gold-dark: #B4922A;
            
            /* UI Colors */
            --success-green: #27AE60;
            --warning-orange: #E67E22;
            --danger-red: #C0392B;
            --info-blue: #2980B9;
            
            /* Backgrounds */
            --bg-primary: linear-gradient(135deg, #0D0D0D 0%, var(--corinthia-dark) 50%, var(--corinthia-charcoal) 100%);
            --bg-card: rgba(45, 45, 45, 0.8);
            --bg-card-hover: rgba(60, 60, 60, 0.9);
            
            /* Typography */
            --font-display: 'Playfair Display', serif;
            --font-body: 'Cairo', sans-serif;
            
            /* Effects */
            --gold-glow: 0 0 20px rgba(212, 175, 55, 0.3);
            --gold-border: 1px solid var(--corinthia-gold);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: var(--font-body);
            background: var(--bg-primary);
            min-height: 100vh;
            color: #f5f5f5;
            background-attachment: fixed;
        }
        
        /* =========================================
           HEADER - Premium Branding
           ========================================= */
        .page-header {
            background: linear-gradient(135deg, var(--corinthia-maroon) 0%, var(--corinthia-dark) 100%);
            padding: 0;
            border-bottom: 3px solid var(--corinthia-gold);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }
        
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 25px;
            flex-wrap: wrap;
            gap: 15px;
        }
        
        .corinthia-logo {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            flex: 1;
            min-width: 200px;
        }
        
        .logo-emblem {
            width: 55px;
            height: 55px;
            background: linear-gradient(135deg, var(--corinthia-gold) 0%, var(--corinthia-gold-dark) 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--gold-glow);
            margin-bottom: 8px;
        }
        
        .logo-emblem i {
            font-size: 1.4rem;
            color: var(--corinthia-dark);
        }
        
        .brand-title {
            font-family: var(--font-display);
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--corinthia-gold);
            letter-spacing: 2px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }
        
        .brand-subtitle {
            font-family: var(--font-display);
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.8);
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-top: 3px;
        }
        
        .header-controls {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: flex-end;
        }
        
        .language-switch {
            display: flex;
            gap: 0;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid rgba(212, 175, 55, 0.3);
        }
        
        .lang-btn {
            padding: 8px 14px;
            border: none;
            background: transparent;
            color: rgba(255, 255, 255, 0.7);
            cursor: pointer;
            font-family: var(--font-body);
            font-weight: 500;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }
        
        .lang-btn:hover {
            color: var(--corinthia-gold);
            background: rgba(212, 175, 55, 0.1);
        }
        
        .lang-btn.active {
            background: var(--corinthia-gold);
            color: var(--corinthia-dark);
            font-weight: 600;
        }
        
        .nav-btn {
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.2) 0%, rgba(212, 175, 55, 0.1) 100%);
            border: 1px solid var(--corinthia-gold);
            color: var(--corinthia-gold);
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-family: var(--font-body);
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
            white-space: nowrap;
            transition: all 0.3s ease;
        }
        
        .nav-btn:hover {
            background: var(--corinthia-gold);
            color: var(--corinthia-dark);
            box-shadow: var(--gold-glow);
        }
        
        .logout-btn {
            background: linear-gradient(135deg, var(--danger-red) 0%, #922B21 100%);
            border: none;
            color: white;
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-family: var(--font-body);
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
            transition: all 0.3s ease;
        }
        
        .logout-btn:hover {
            background: linear-gradient(135deg, #A93226 0%, #7B241C 100%);
            transform: translateY(-2px);
        }
        
        .page-description {
            background: rgba(0, 0, 0, 0.3);
            padding: 15px 30px;
            text-align: center;
            border-top: 1px solid rgba(212, 175, 55, 0.2);
        }
        
        .page-description h2 {
            font-family: var(--font-display);
            font-size: 1.3rem;
            color: var(--corinthia-gold);
            font-weight: 500;
        }
        
        .page-description p {
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.9rem;
            margin-top: 5px;
        }
        
        /* =========================================
           MAIN CONTENT
           ========================================= */
        .main-content {
            max-width: 1400px;
            margin: 0 auto;
            padding: 30px;
        }
        
        /* Stats Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: var(--bg-card);
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 12px;
            padding: 25px;
            text-align: center;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--corinthia-gold), transparent);
        }
        
        .stat-card:hover {
            transform: translateY(-5px);
            border-color: var(--corinthia-gold);
            box-shadow: var(--gold-glow);
            background: var(--bg-card-hover);
        }
        
        .stat-card .icon {
            font-size: 2.2rem;
            margin-bottom: 12px;
        }
        
        .stat-card.served .icon { color: var(--success-green); }
        .stat-card.noshow .icon { color: var(--warning-orange); }
        .stat-card.cancelled .icon { color: var(--danger-red); }
        .stat-card.expired .icon { color: rgba(255, 255, 255, 0.5); }
        
        .stat-card h3 {
            font-family: var(--font-display);
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.8);
            font-weight: 500;
            margin-bottom: 10px;
        }
        
        .stat-card .value {
            font-family: var(--font-display);
            font-size: 2.5rem;
            font-weight: 600;
            color: var(--corinthia-gold);
        }
        
        /* Filters Section */
        .filters-section {
            background: var(--bg-card);
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 12px;
            padding: 20px 25px;
            margin-bottom: 25px;
        }
        
        .filters-row {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }
        
        .search-box {
            flex: 1;
            min-width: 250px;
            position: relative;
        }
        
        .search-box input {
            width: 100%;
            padding: 12px 15px 12px 45px;
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.3);
            color: var(--corinthia-gold);  /* Gold text */
            font-family: var(--font-body);
            font-size: 0.95rem;
            text-transform: uppercase;  /* Force uppercase */
            letter-spacing: 2px;
            transition: all 0.3s ease;
        }
        
        .search-box input:focus {
            outline: none;
            border-color: var(--corinthia-gold);
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.2);
        }
        
        .search-box input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }
        
        .search-box i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--corinthia-gold);
        }
        
        .filter-select {
            padding: 12px 15px;
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.3);
            color: #fff;
            font-family: var(--font-body);
            font-size: 0.95rem;
            cursor: pointer;
            min-width: 160px;
        }
        
        .filter-select:focus {
            outline: none;
            border-color: var(--corinthia-gold);
        }
        
        .filter-select option {
            background: var(--corinthia-dark);
        }
        
        /* Date Filter Group */
        .date-filter-group {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        
        .filter-input {
            padding: 12px 15px;
            border-radius: 8px;
            border: 1px solid var(--corinthia-gold);
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            font-family: 'Cairo', sans-serif;
            font-size: 0.9rem;
            min-width: 140px;
        }
        
        .filter-input:focus {
            outline: none;
            border-color: var(--corinthia-gold-light);
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.3);
        }
        
        .filter-input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }
        
        /* Date Range Input Styling */
        .date-range-input {
            height: 45px !important;
            padding: 0 15px !important;
            border: 1px solid rgba(212, 175, 55, 0.4) !important;
            background: rgba(255, 255, 255, 0.05) !important;
            color: white !important;
            border-radius: 8px !important;
            min-width: 200px;
        }
        
        .search-bar-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .btn-clear {
            padding: 10px 14px;
            margin-right: 8px;
            border-radius: 8px;
            border: none;
            background: transparent;
            color: #d4af37;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .btn-clear:hover {
            background: rgba(212, 175, 55, 0.15);
            transform: scale(1.1);
        }
        
        .btn-clear i {
            font-size: 0.9rem;
        }
        
        .export-btn {
            background: linear-gradient(135deg, var(--corinthia-gold) 0%, var(--corinthia-gold-dark) 100%);
            color: var(--corinthia-dark);
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-family: var(--font-body);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
        }
        
        .export-btn:hover {
            background: linear-gradient(135deg, var(--corinthia-gold-light) 0%, var(--corinthia-gold) 100%);
            box-shadow: var(--gold-glow);
            transform: translateY(-2px);
        }
        
        /* =========================================
           FLATPICKR CALENDAR THEME
           ========================================= */
        .flatpickr-calendar {
            background: #2d2d2d;
            border-top: 3px solid var(--corinthia-gold);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border-radius: 12px;
        }
        
        .flatpickr-months {
            background: linear-gradient(135deg, var(--corinthia-maroon) 0%, var(--corinthia-dark) 100%);
            border-radius: 12px 12px 0 0;
        }
        
        .flatpickr-months .flatpickr-month {
            color: #fff;
            fill: #fff;
        }
        
        .flatpickr-weekday {
            background: rgba(212, 175, 55, 0.1);
            color: var(--corinthia-gold);
            font-weight: 600;
        }
        
        .flatpickr-day {
            color: #f5f5f5;
            border-color: rgba(212, 175, 55, 0.2);
        }
        
        .flatpickr-day:hover {
            background: rgba(212, 175, 55, 0.2);
        }
        
        .flatpickr-day.selected {
            background: var(--corinthia-gold) !important;
            border-color: var(--corinthia-gold) !important;
            color: var(--corinthia-dark) !important;
        }
        
        .flatpickr-day.inRange {
            background: rgba(212, 175, 55, 0.3) !important;
            border-color: rgba(212, 175, 55, 0.3) !important;
            color: #fff !important;
            box-shadow: -5px 0 0 rgba(212, 175, 55, 0.3), 5px 0 0 rgba(212, 175, 55, 0.3);
        }
        
        .flatpickr-day.startRange, .flatpickr-day.endRange {
            background: var(--corinthia-gold) !important;
            border-color: var(--corinthia-gold) !important;
            color: var(--corinthia-dark) !important;
        }
        
        .flatpickr-current-month .flatpickr-monthDropdown-months {
            background: transparent;
            color: #fff;
        }
        
        .flatpickr-current-month input.cur-year {
            color: #fff;
        }
        
        .numInputWrapper:hover {
            background: rgba(212, 175, 55, 0.1);
        }
        
        /* =========================================
           PREMIUM TABLE DESIGN
           ========================================= */
        .table-container {
            background: var(--bg-card);
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 12px;
            overflow: hidden;
        }
        
        .archive-table {
            width: 100%;
            border-collapse: collapse;
        }
        
        .archive-table thead {
            background: linear-gradient(135deg, var(--corinthia-maroon) 0%, var(--corinthia-dark) 100%);
        }
        
        .archive-table th {
            padding: 18px 15px;
            text-align: center;
            font-family: var(--font-display);
            font-weight: 600;
            font-size: 0.95rem;
            color: var(--corinthia-gold);
            letter-spacing: 0.5px;
            border-bottom: 2px solid var(--corinthia-gold);
        }
        
        .archive-table tbody tr {
            transition: all 0.3s ease;
            border-bottom: 1px solid rgba(212, 175, 55, 0.1);
        }
        
        .archive-table tbody tr:hover {
            background: rgba(212, 175, 55, 0.08);
            border-left: 3px solid var(--corinthia-gold);
        }
        
        .archive-table td {
            padding: 15px;
            text-align: center;
            font-size: 0.9rem;
        }
        
        .ref-cell {
            font-family: monospace;
            font-weight: 600;
            color: var(--corinthia-gold);
            letter-spacing: 1px;
        }
        
        .guest-info {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }
        
        .guest-info .name {
            font-weight: 600;
            color: #fff;
        }
        
        .guest-info .phone {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.5);
        }
        
        .date-cell, .archived-date {
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.85rem;
        }
        
        /* Status Badges */
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 500;
        }
        
        .badge-arrived {
            background: rgba(39, 174, 96, 0.2);
            color: var(--success-green);
            border: 1px solid var(--success-green);
        }
        
        .badge-noshow {
            background: rgba(230, 126, 34, 0.2);
            color: var(--warning-orange);
            border: 1px solid var(--warning-orange);
        }
        
        .badge-cancelled {
            background: rgba(192, 57, 43, 0.2);
            color: var(--danger-red);
            border: 1px solid var(--danger-red);
        }
        
        .badge-expired {
            background: rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .badge-default {
            background: rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        
        .badge-pending {
            background: rgba(212, 175, 55, 0.2);
            color: var(--corinthia-gold);
            border: 1px solid var(--corinthia-gold);
        }
        
        /* Center-aligned table cells */
        .archive-table th,
        .archive-table td {
            text-align: center;
            vertical-align: middle;
        }
        
        .archive-table .ref-cell,
        .archive-table .guests-cell,
        .archive-table .status-cell,
        .archive-table .archived-date-cell,
        .archive-table .performed-by-cell,
        .archive-table .actions-cell {
            text-align: center;
        }
        
        .ref-number {
            font-weight: 600;
            color: var(--corinthia-gold);
            font-family: monospace;
        }
        
        .guests-count {
            background: rgba(212, 175, 55, 0.2);
            padding: 4px 10px;
            border-radius: 12px;
            font-weight: 600;
            color: var(--corinthia-gold);
        }
        
        .admin-name {
            color: var(--corinthia-gold);
            font-weight: 500;
        }
        
        .date-na {
            color: rgba(255, 255, 255, 0.4);
            font-style: italic;
        }
        
        /* Restore Button - Premium Style */
        .btn-restore {
            background: linear-gradient(135deg, var(--success-green) 0%, #219A52 100%);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-family: var(--font-body);
            font-size: 0.85rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.3s ease;
            box-shadow: 0 3px 10px rgba(39, 174, 96, 0.3);
        }
        
        .btn-restore:hover {
            background: linear-gradient(135deg, #2ECC71 0%, var(--success-green) 100%);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(39, 174, 96, 0.4);
        }
        
        .btn-restore i {
            font-size: 0.9rem;
        }
        
        .actions-cell {
            white-space: nowrap;
        }
        
        .performed-by-cell {
            font-size: 0.85rem;
            color: var(--corinthia-gold);
            font-weight: 500;
        }
        
        /* Empty/Loading States */
        .empty-state, .loading-state {
            padding: 60px 20px;
            text-align: center;
            color: rgba(255, 255, 255, 0.5);
        }
        
        .empty-state i, .loading-state i {
            font-size: 3rem;
            margin-bottom: 15px;
            color: var(--corinthia-gold);
        }
        
        .empty-state p, .loading-state p {
            font-family: var(--font-display);
            font-size: 1.1rem;
        }
        
        /* Pagination */
        .pagination {
            display: flex;
            justify-content: center;
            gap: 8px;
            padding: 20px;
            background: rgba(0, 0, 0, 0.2);
            border-top: 1px solid rgba(212, 175, 55, 0.1);
        }
        
        .pagination button {
            background: rgba(212, 175, 55, 0.1);
            border: 1px solid rgba(212, 175, 55, 0.3);
            color: var(--corinthia-gold);
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-family: var(--font-body);
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }
        
        .pagination button:hover:not(:disabled) {
            background: var(--corinthia-gold);
            color: var(--corinthia-dark);
        }
        
        .pagination button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        
        .pagination button.active {
            background: var(--corinthia-gold);
            color: var(--corinthia-dark);
            font-weight: bold;
        }
        
        /* Toast Notifications */
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            padding: 15px 25px;
            border-radius: 10px;
            color: white;
            font-weight: 500;
            z-index: 10000;
            animation: slideIn 0.3s ease;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.4);
            font-family: var(--font-body);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .toast.success {
            background: linear-gradient(135deg, var(--success-green) 0%, #219A52 100%);
            border: 1px solid #2ECC71;
        }
        
        .toast.error {
            background: linear-gradient(135deg, var(--danger-red) 0%, #922B21 100%);
            border: 1px solid #E74C3C;
        }
        
        .toast.info {
            background: linear-gradient(135deg, var(--info-blue) 0%, #1A5276 100%);
            border: 1px solid #3498DB;
        }
        
        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
        
        /* Responsive Design */
        @media (max-width: 768px) {
            .header-top {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }
            
            .header-controls {
                position: static;
                transform: none;
                flex-wrap: wrap;
                justify-content: center;
                width: 100%;
            }
            
            .corinthia-logo {
                order: -1;
                width: 100%;
            }
            
            .brand-title {
                font-size: 1.3rem;
            }
            
            .filters-row {
                flex-direction: column;
            }
            
            .search-box, .filter-select, .export-btn, .date-filter-group, .filter-input {
                width: 100%;
            }
            
            .date-filter-group {
                flex-wrap: wrap;
            }
            
            .archive-table {
                font-size: 0.75rem;
            }
            
            .archive-table th, .archive-table td {
                padding: 8px 5px;
            }
        }
    </style>
</head>
<body>
    <!-- Premium Header -->
    <header class="page-header">
        <div class="header-top">
            <div class="header-controls">
                <!-- Language Switcher -->
                <div class="language-switch">
                    <button class="lang-btn active" data-lang="ar" data-action="setLanguage" data-args='["ar"]'>عربي</button>
                    <button class="lang-btn" data-lang="en" data-action="setLanguage" data-args='["en"]'>EN</button>
                </div>
                
                <!-- Navigation -->
                <a href="admin-dashboard.html" class="nav-btn">
                    <i class="fas fa-arrow-right"></i>
                    <span class="btn-text" data-ar="لوحة التحكم" data-en="Dashboard">لوحة التحكم</span>
                </a>
                
                <!-- Logout -->
                <button class="logout-btn" data-action="logout">
                    <i class="fas fa-sign-out-alt"></i>
                    <span class="btn-text" data-ar="خروج" data-en="Logout">خروج</span>
                </button>
            </div>
            
            <!-- Corinthia Logo & Branding -->
            <div class="corinthia-logo">
                <div class="logo-emblem">
                    <i class="fas fa-hotel"></i>
                </div>
                <div class="brand-title">كورنثيا</div>
                <div class="brand-subtitle">CORINTHIA</div>
            </div>
        </div>
        
        <div class="page-description">
            <h2 class="page-title" data-ar="سجل وأرشيف الحجوزات" data-en="Booking History & Archives">سجل وأرشيف الحجوزات</h2>
            <p class="page-subtitle" data-ar="مطاعم كورنثيا - تاريخ الحجوزات المكتملة والملغاة" data-en="Corinthia Restaurants - Complete Booking History">مطاعم كورنثيا - تاريخ الحجوزات المكتملة والملغاة</p>
        </div>
    </header>

    <!-- Main Content -->
    <div class="main-content">
        <!-- Stats Cards -->
        <div class="stats-grid">
            <div class="stat-card served">
                <i class="fas fa-check-circle icon"></i>
                <h3 class="stat-title" data-ar="تم خدمة" data-en="Guests Served">تم خدمة</h3>
                <div class="value" id="servedCount">0</div>
            </div>
            <div class="stat-card noshow">
                <i class="fas fa-user-clock icon"></i>
                <h3 class="stat-title" data-ar="لم يحضر" data-en="No Shows">لم يحضر</h3>
                <div class="value" id="noShowCount">0</div>
            </div>
            <div class="stat-card cancelled">
                <i class="fas fa-times-circle icon"></i>
                <h3 class="stat-title" data-ar="ملغى" data-en="Cancelled">ملغى</h3>
                <div class="value" id="cancelledCount">0</div>
            </div>
            <div class="stat-card expired">
                <i class="fas fa-clock icon"></i>
                <h3 class="stat-title" data-ar="منتهي الصلاحية" data-en="Expired">منتهي الصلاحية</h3>
                <div class="value" id="expiredCount">0</div>
            </div>
        </div>

        <!-- Filters -->
        <div class="filters-section">
            <div class="filters-row">
                <div class="search-box">
                    <i class="fas fa-search"></i>
                    <input type="text" id="searchInput" class="search-field" 
                           data-placeholder-ar="البحث بالاسم أو رقم الهاتف..." 
                           data-placeholder-en="RMD12345" 
                           placeholder="RMD12345" 
                           maxlength="10" pattern="[A-Za-z0-9\-]*"
                           autocomplete="off"
                           data-on-input="cleanArchiveSearch" data-pass="element">
                </div>
                <div class="date-range-container">
                    <i class="fas fa-history"></i>
                    <input type="text" id="archiveRangePicker" data-i18n-attr="placeholder:select_date_range" class="flatpickr-input date-range-input">
                    <button id="clearDates" class="btn-clear" data-action="clearDateFilters" title="Clear dates">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
                <select id="reasonFilter" class="filter-select" data-on-change="applyFilters">
                    <option value="" class="filter-option" data-ar="جميع الأسباب" data-en="All Reasons">جميع الأسباب</option>
                    <option value="Arrived" class="filter-option" data-ar="تم الحضور" data-en="Arrived">تم الحضور</option>
                    <option value="No-Show" class="filter-option" data-ar="لم يحضر" data-en="No Show">لم يحضر</option>
                    <option value="Cancelled" class="filter-option" data-ar="ملغى" data-en="Cancelled">ملغى</option>
                    <option value="Expired" class="filter-option" data-ar="منتهي" data-en="Expired">منتهي</option>
                </select>
                <button class="export-btn" data-action="exportToExcel">
                    <i class="fas fa-file-excel"></i>
                    <span class="btn-text" data-i18n="btn_export" data-ar="تصدير Excel" data-en="Export Excel">تصدير Excel</span>
                </button>
            </div>
        </div>

        <!-- Table -->
        <div class="table-container">
            <table id="archivesTable" class="archive-table">
                <thead>
                    <tr>
                        <th class="th-ref" data-ar="المرجع" data-en="Reference">المرجع</th>
                        <th class="th-guest" data-ar="اسم الضيف" data-en="Guest Name">اسم الضيف</th>
                        <th class="th-date" data-ar="تاريخ الحجز" data-en="Booking Date">تاريخ الحجز</th>
                        <th class="th-guests" data-ar="الضيوف" data-en="Guests">الضيوف</th>
                        <th class="th-reason" data-ar="الحالة" data-en="Status">الحالة</th>
                        <th class="th-archived" data-ar="أرشيف في" data-en="Archived">أرشيف في</th>
                        <th class="th-performed" data-ar="بواسطة" data-en="By">بواسطة</th>
                        <th class="th-actions" data-ar="إجراءات" data-en="Actions">إجراءات</th>
                    </tr>
                </thead>
                <tbody id="archiveTableBody">
                    <tr>
                        <td colspan="8" class="loading-state">
                            <i class="fas fa-spinner fa-spin"></i>
                            <p class="loading-text" data-ar="جاري تحميل البيانات..." data-en="Loading data...">جاري تحميل البيانات...</p>
                        </td>
                    </tr>
                </tbody>
            </table>
            
            <!-- Pagination -->
            <div class="pagination" id="pagination"></div>
        </div>
    </div>

    <script src="actions.js"></script>

    <script src="constants.js"></script>
    <script src="i18n.js"></script>
    <script src="archives.js"></script>
</body>
</html>
