<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Royal Staff Portal | Corinthia Hotel</title>
    
    <!-- Luxury Design System -->
    <link rel="stylesheet" href="luxury-design-system.css">
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=Cinzel:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        /* Admin Login Specific Styles - English/LTR Only */
        .admin-login-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            position: relative;
            background-image: url('lobby.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            direction: ltr !important;
        }
        
        .admin-login-wrapper::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, 
                rgba(0, 33, 71, 0.95) 0%, 
                rgba(0, 33, 71, 0.9) 50%, 
                rgba(0, 33, 71, 0.95) 100%);
            backdrop-filter: blur(3px);
        }
        
        .admin-login-card {
            max-width: 480px;
            width: 100%;
            position: relative;
            z-index: 1;
        }
        
        .admin-logo-section {
            text-align: center;
            margin-bottom: 40px;
        }
        
        .admin-logo-section img {
            height: 80px;
            filter: drop-shadow(0 0 20px var(--gold-glow));
            transition: transform var(--transition);
        }
        
        .admin-logo-section img:hover {
            transform: scale(1.05);
        }
        
        .admin-login-title {
            font-family: var(--font-heading-en);
            font-size: 2.2rem;
            color: var(--gold);
            margin-bottom: 15px;
            text-shadow: 0 0 30px var(--gold-glow);
            text-align: left !important;
        }
        
        .admin-login-subtitle {
            font-family: var(--font-body);
            font-size: 1rem;
            color: rgba(249, 247, 242, 0.7);
            margin-bottom: 40px;
            text-align: left !important;
        }
        
        .admin-form-group {
            margin-bottom: 30px;
        }
        
        .admin-form-group label {
            display: block;
            color: var(--cream);
            font-weight: 600;
            margin-bottom: 12px;
            font-size: 0.95rem;
            letter-spacing: 0.5px;
            text-align: left !important;
            font-family: var(--font-body);
        }
        
        .admin-input-wrapper {
            position: relative;
        }
        
        .admin-input-wrapper i {
            position: absolute;
            left: 20px;
            right: auto;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gold);
            font-size: 1.1rem;
            pointer-events: none;
        }
        
        .admin-input {
            width: 100%;
            padding: 18px 24px 18px 55px;
            font-family: var(--font-body);
            font-size: 1rem;
            color: var(--cream);
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(212, 175, 55, 0.3);
            border-radius: 0;
            outline: none;
            transition: var(--transition);
            direction: ltr !important;
            text-align: left !important;
        }
        
        .admin-input:focus {
            border-color: var(--gold);
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 30px var(--gold-glow);
        }
        
        .admin-input::placeholder {
            color: rgba(249, 247, 242, 0.4);
            font-family: var(--font-body);
        }
        
        .admin-error-message {
            background: rgba(231, 76, 60, 0.15);
            border: 1px solid var(--danger);
            color: var(--danger);
            padding: 20px;
            border-radius: 0;
            margin: 30px 0;
            text-align: center;
            font-size: 0.95rem;
            display: none;
            animation: shakeError 0.5s ease;
            font-family: var(--font-body);
        }
        
        .admin-error-message.show {
            display: block;
        }
        
        @keyframes shakeError {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }
        
        .admin-submit-btn {
            width: 100%;
            padding: 20px;
            margin-top: 20px;
            font-size: 1.1rem;
            font-family: var(--font-body);
        }
        
        .admin-back-link {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            color: rgba(249, 247, 242, 0.7);
            text-decoration: none;
            margin-top: 40px;
            font-size: 0.95rem;
            transition: var(--transition);
            font-family: var(--font-body);
            direction: ltr !important;
        }
        
        .admin-back-link:hover {
            color: var(--gold);
        }
        
        .admin-loading-spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(0, 0, 0, 0.3);
            border-top-color: #000;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        
        .admin-submit-btn.loading .admin-btn-text {
            opacity: 0;
        }
        
        .admin-submit-btn.loading .admin-loading-spinner {
            display: inline-block;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    
    <div class="admin-login-wrapper">
        <div class="luxury-card admin-login-card">
            <div class="admin-logo-section">
                <img src="new-logo.svg" alt="Corinthia Hotel Logo" style="height: 80px; filter: drop-shadow(0 0 20px var(--gold-glow)); transition: transform var(--transition);">
            </div>

            <h1 class="admin-login-title">Royal Staff Portal</h1>
            <p class="admin-login-subtitle">Please sign in to access the control panel</p>

            <form id="adminLoginForm">
                <div class="admin-form-group">
                    <label>Username</label>
                    <div class="admin-input-wrapper">
                        <i class="fas fa-user"></i>
                        <input type="text" id="adminUser" 
                               class="admin-input" 
                               placeholder="Enter your username" 
                               required 
                               autocomplete="username">
                    </div>
                </div>

                <div class="admin-form-group">
                    <label>Password</label>
                    <div class="admin-input-wrapper">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="adminPass" 
                               class="admin-input" 
                               placeholder="Enter your password" 
                               required 
                               autocomplete="current-password">
                    </div>
                </div>

                <div id="loginErrorMessage" class="admin-error-message">
                    Invalid username or password
                </div>

                <button type="submit" class="luxury-btn admin-submit-btn" id="loginSubmitBtn">
                    <span class="admin-btn-text">SECURE ACCESS</span>
                    <span class="admin-loading-spinner"></span>
                    <i class="fas fa-shield-alt"></i>
                </button>
            </form>

            <a href="index.html" class="admin-back-link">
                <i class="fas fa-arrow-left"></i>
                <span>Back to Main Site</span>
            </a>
        </div>
    </div>

    <script src="constants.js"></script>
    <script src="admin-login.js"></script>
</body>
</html>
