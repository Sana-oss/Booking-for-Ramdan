    <rect x="34" y="50" width="4" height="4" fill="#101820"/>
    <rect x="50" y="50" width="4" height="4" fill="#101820"/>
    <rect x="74" y="50" width="4" height="4" fill="#101820"/>
    <rect x="90" y="50" width="4" height="4" fill="#101820"/>
    
    <rect x="18" y="58" width="4" height="4" fill="#101820"/>
    <rect x="34" y="58" width="4" height="4" fill="#101820"/>
    <rect x="66" y="58" width="4" height="4" fill="#101820"/>
