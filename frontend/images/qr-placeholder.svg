    <rect x="22" y="22" width="12" height="12" fill="#101820"/>
    <rect x="24" y="24" width="8" height="8" fill="#ffffff"/>
    <rect x="26" y="26" width="4" height="4" fill="#101820"/>
    
    <!-- Top-right corner marker -->
