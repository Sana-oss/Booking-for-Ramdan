    <rect x="66" y="74" width="4" height="4" fill="#101820"/>
    <rect x="82" y="74" width="4" height="4" fill="#101820"/>
    
    <rect x="18" y="82" width="4" height="4" fill="#101820"/>
    <rect x="42" y="82" width="4" height="4" fill="#101820"/>
    <rect x="58" y="82" width="4" height="4" fill="#101820"/>
