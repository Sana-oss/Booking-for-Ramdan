<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corinthia Hotel - تتبع الحجز</title>
    
    <!-- Google Fonts for fallback -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- QR Code Generator Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <!-- html2canvas Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <!-- Luxury Design System -->
    <link rel="stylesheet" href="luxury-design-system.css">
    
    <link rel="stylesheet" href="main.css">
    
    <style>
        /* =========================================
           CORINTHIA LUXURY CHECK-STATUS STYLE
           Corporate Identity Implementation
           ========================================= */
        
        /* Main Styles */
        body {
            font-family: var(--font-body);
            background: var(--corinthia-haze);
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
        }
        
        /* Anti-Flicker */
        .main-card {
            max-width: 500px;
            width: 100%;
            background: var(--white);
            border: 1px solid var(--corinthia-clay);
            border-radius: 4px;
            padding: 40px 30px;
            text-align: center;
            position: relative;
            box-shadow: 0 10px 50px var(--anvil-shadow);
            /* Anti-flicker */
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 0.5s ease-out, transform 0.5s ease-out;
        }
        
        .main-card.visible {
            opacity: 1;
            transform: translateY(0);
        }
        
        /* Language Toggle */
        .lang-toggle {
            position: absolute;
            top: 20px;
            left: 20px;
            background: var(--white);
            border: 1px solid var(--corinthia-honey);
            color: var(--corinthia-honey);
            padding: 10px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-family: var(--font-body);
            font-weight: 600;
            transition: var(--transition);
            z-index: 10;
        }
        
        .lang-toggle:hover {
            background: var(--corinthia-honey);
            color: var(--white);
        }
        
        /* Logo */
        .card-logo {
            margin-bottom: 25px;
        }
        
        .card-logo img {
            height: 60px;
            filter: drop-shadow(0 0 20px var(--honey-glow));
        }
        
        /* Result Logo - Logo at top of result card */
        .result-logo {
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255, 163, 0, 0.3);
        }
        
        .result-logo img {
            height: 50px;
            filter: drop-shadow(0 0 15px var(--honey-glow));
        }
        
        /* Title */
        .page-title {
            margin-bottom: 30px;
        }
        
        .page-title h1 {
            font-family: var(--font-arabic);
            font-size: 1.5rem;
            font-weight: 500;
            color: var(--corinthia-anvil);
            margin-bottom: 8px;
        }
        
        .page-title p {
            color: rgba(16, 24, 32, 0.7);
            font-size: 0.9rem;
            font-family: var(--font-body);
        }
        
        /* Search Section */
        .search-section {
            margin-bottom: 25px;
        }
        
        .search-input-wrapper {
            position: relative;
            display: flex;
            gap: 10px;
        }
        
        .search-input {
            flex: 1;
            background: var(--white);
            border: 2px solid var(--corinthia-clay);
            border-radius: 4px;
            padding: 16px 20px;
            color: var(--corinthia-anvil);
            font-family: var(--font-numeric);
            font-size: 1rem;
            text-align: center;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 500;
            transition: var(--transition);
        }
        
        .search-input:focus {
            outline: none;
            border-color: var(--corinthia-honey);
            box-shadow: 0 0 20px var(--honey-glow);
        }
        
        .search-input::placeholder {
            color: rgba(16, 24, 32, 0.4);
            letter-spacing: 1px;
        }
        
        .search-btn {
            background: var(--corinthia-honey);
            color: var(--corinthia-anvil);
            border: 2px solid var(--corinthia-honey);
            border-radius: 4px;
            padding: 16px 24px;
            cursor: pointer;
            font-family: var(--font-body);
            font-weight: 700;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .search-btn:hover {
            background: var(--corinthia-anvil);
            color: var(--corinthia-honey);
            border-color: var(--corinthia-anvil);
        }
        
        /* Status Timeline */
        .status-timeline {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 30px 0;
            position: relative;
            padding: 0 10px;
        }
        
        .status-timeline::before {
            content: '';
            position: absolute;
            top: 20px;
            left: 25px;
            right: 25px;
            height: 2px;
            background: rgba(16, 24, 32, 0.2);
        }
        
        .timeline-step {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            z-index: 1;
        }
        
        .step-icon {
            width: 40px;
            height: 40px;
            border-radius: 4px;
            background: var(--white);
            border: 2px solid rgba(16, 24, 32, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            color: rgba(16, 24, 32, 0.5);
            transition: var(--transition);
            margin-bottom: 10px;
        }
        
        .step-icon.active {
            background: var(--corinthia-honey);
            border-color: var(--corinthia-honey);
            color: var(--corinthia-anvil);
        }
        
        .step-icon.current {
            background: rgba(255, 163, 0, 0.2);
            border-color: var(--corinthia-honey);
            color: var(--corinthia-honey);
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(255, 163, 0, 0.4); }
            50% { box-shadow: 0 0 0 8px rgba(255, 163, 0, 0); }
        }
        
        .step-label {
            font-family: var(--font-arabic);
            font-size: 0.75rem;
            color: rgba(16, 24, 32, 0.6);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        /* Result Section */
        .result-section {
            display: none;
            margin-top: 30px;
            text-align: center;
        }
        
        .result-section.show {
            display: block;
            animation: fadeIn 0.5s ease-out;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .result-card {
            background: rgba(16, 24, 32, 0.02);
            border: 1px solid var(--corinthia-clay);
            padding: 25px;
            text-align: center;
        }
        
        /* Guest Details */
        .guest-details {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }
        
        .guest-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid rgba(175, 169, 160, 0.3);
        }
        
        .guest-row:last-child {
            border-bottom: none;
        }
        
        .guest-label {
            font-family: var(--font-arabic);
            font-size: 0.85rem;
            color: var(--corinthia-clay);
        }
        
        .guest-value {
            font-family: var(--font-body);
            font-size: 0.9rem;
            color: var(--corinthia-anvil);
            font-weight: 500;
        }
        
        /* Status Badge */
        .status-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 24px;
            border-radius: 4px;
            font-family: var(--font-body);
            font-weight: 700;
            font-size: 0.9rem;
            margin-bottom: 20px;
        }
        
        .status-badge i {
            font-size: 1.1rem;
        }
        
        .status-pending {
            background: rgba(255, 163, 0, 0.15);
            border: 1px solid #FFA300;
            color: #CC8200;
        }
        
        .status-confirmed {
            background: rgba(39, 174, 96, 0.15);
            border: 1px solid #2ecc71;
            color: #27ae60;
        }
        
        .status-cancelled {
            background: rgba(231, 76, 60, 0.15);
            border: 1px solid #e74c3c;
            color: #c0392b;
        }
        
        /* Status Message */
        .status-message {
            font-family: var(--font-body);
            font-size: 0.85rem;
            color: rgba(16, 24, 32, 0.7);
            margin-bottom: 20px;
            line-height: 1.6;
        }
        
        /* Action Buttons */
        .result-actions {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 35px;
            padding: 0 10px;
        }
        
        /* Base Button Styles */
        .action-btn,
        .result-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 16px 32px;
            font-family: var(--font-body);
            font-weight: 600;
            font-size: 0.95rem;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: var(--transition);
            text-decoration: none;
            border-radius: 2px;
        }
        
        /* Primary Button - Download Receipt (Gold) */
        .action-btn.primary,
        .result-btn.primary {
            background: var(--corinthia-honey);
            color: var(--white);
            border: 2px solid var(--corinthia-honey);
            box-shadow: 0 4px 15px var(--honey-glow);
        }
        
        .action-btn.primary:hover,
        .result-btn.primary:hover {
            background: #CC8200;
            border-color: #CC8200;
            box-shadow: 0 6px 25px var(--honey-glow);
            transform: translateY(-2px);
        }
        
        .action-btn.primary .fas,
        .result-btn.primary .fas {
            color: var(--white);
            font-size: 1.1em;
        }
        
        /* Secondary Button - New Booking (Ghost) */
        .action-btn.secondary,
        .result-btn.secondary {
            background: transparent;
            color: var(--corinthia-honey);
            border: 2px solid var(--corinthia-honey);
            box-shadow: none;
        }
        
        .action-btn.secondary:hover,
        .result-btn.secondary:hover {
            background: rgba(255, 163, 0, 0.1);
            border-color: var(--corinthia-honey);
            box-shadow: none;
        }
        
        .action-btn.secondary .fas,
        .result-btn.secondary .fas {
            color: var(--corinthia-honey);
            font-size: 1.1em;
        }
        
        /* Responsive Button Adjustments */
        @media (max-width: 500px) {
            .result-actions {
                padding: 0 5px;
            }
            
            .action-btn,
            .result-btn {
                padding: 14px 24px;
                font-size: 0.9rem;
            }
        }
        
        /* Error Message */
        .error-message {
            display: none;
            background: rgba(231, 76, 60, 0.1);
            border: 1px solid #e74c3c;
            border-radius: 4px;
            padding: 15px;
            margin-top: 20px;
            color: #c0392b;
            font-family: var(--font-body);
        }
        
        .error-message.show {
            display: block;
        }
        
        /* Responsive */
        @media (max-width: 500px) {
            .main-card {
                padding: 30px 20px;
            }
            
            .page-title h1 {
                font-size: 1.3rem;
            }
            
            .search-input-wrapper {
                flex-direction: column;
            }
            
            .search-btn {
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    
    <!-- Language Toggle -->
    <button class="lang-toggle" onclick="toggleLanguage()">
        <span id="langText">العربية</span>
    </button>
    
    <!-- Main Card -->
    <div class="main-card" id="mainCard">
        <!-- Logo -->
        <div class="card-logo">
            <img src="new-logo.svg" alt="Corinthia Hotel Tripoli Logo">
        </div>
        
        <!-- Title -->
        <div class="page-title">
            <h1>تتبع حالة الحجز</h1>
            <p>أدخل الرقم المرجعي للتحقق من حالة الحجز</p>
        </div>
        
        <!-- Search Section -->
        <div class="search-section" id="searchSection">
            <div class="search-input-wrapper">
                <input type="text" id="bookingID" class="search-input" placeholder="CRT-XXXX" maxlength="10">
                <button class="search-btn" onclick="performTrack()">
                    <i class="fas fa-search"></i>
                    <span>تتبع</span>
                </button>
            </div>
        </div>
        
        <!-- Error Message -->
        <div class="error-message" id="errorMessage">
            <p>تعذر العثور على بيانات الحجز، يرجى المحاولة لاحقاً</p>
        </div>
        
        <!-- Result Section -->
        <div id="resultSection" class="result-section">
            
            <!-- Logo at Top of Result Card -->
            <div class="result-logo">
                <img src="new-logo.svg" alt="Corinthia Hotel Tripoli Logo">
            </div>
            
            <!-- Guest Details -->
            <div class="guest-details">
                <div class="guest-row">
                    <span class="guest-label">الاسم</span>
                    <span class="guest-value" id="checkGuestName">----</span>
                </div>
                <div class="guest-row">
                    <span class="guest-label">التاريخ</span>
                    <span class="guest-value" id="checkDate">----</span>
                </div>
            </div>
            
            <!-- Status Badge -->
            <div class="status-badge status-pending" id="checkStatusBadge">
                <i class="fas fa-clock" id="statusIcon"></i>
                <span id="statusText">بانتظار التأكيد</span>
            </div>
            
            <!-- Status Message -->
            <div class="status-message" id="statusMessage"></div>
            
            <!-- Status Timeline -->
            <div class="status-timeline">
                <div class="timeline-step" id="step1">
                    <div class="step-icon"><i class="fas fa-file-alt"></i></div>
                    <span class="step-label">قيد التقديم</span>
                </div>
                <div class="timeline-step" id="step2">
                    <div class="step-icon"><i class="fas fa-check"></i></div>
                    <span class="step-label">تم التأكيد</span>
                </div>
                <div class="timeline-step" id="step3">
                    <div class="step-icon"><i class="fas fa-calendar-check"></i></div>
                    <span class="step-label">منجز</span>
                </div>
            </div>
            
            <!-- Action Buttons -->
            <div class="result-actions" id="actionButtons">
                <!-- Buttons will be dynamically shown based on status -->
            </div>
            
            <!-- Reference Number -->
            <div style="margin-top: 20px; padding-top: 20px; border-top: 1px solid rgba(175, 169, 160, 0.3);">
                <div style="font-family: var(--font-body); font-size: 0.7rem; color: var(--honey-gold); text-transform: uppercase; letter-spacing: 1px;">الرقم المرجعي</div>
                <div style="font-family: var(--font-numeric); font-size: 1.5rem; font-weight: 600; color: var(--anvil-dark); margin-top: 5px;" id="checkBookingID">----</div>
            </div>
        </div>
    </div>
    
    <!-- Downloadable Pass Template (Hidden, positioned off-screen for capture) -->
    <div id="downloadablePass" style="position: fixed; left: -9999px; top: 0; width: 400px; background: #FFFFFF; border: 2px solid #D4AF37; padding: 0; text-align: center; font-family: Arial, sans-serif;">
        <!-- Elegant White Header with Graphical Crest -->
        <div style="padding: 35px 25px 25px; background: #FFFFFF; text-align: center;">
