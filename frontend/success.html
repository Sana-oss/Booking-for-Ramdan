<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corinthia Hotel - حجز مؤكد</title>
    
    <!-- Premium Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- html2canvas Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <!-- Luxury Design System -->
    <link rel="stylesheet" href="luxury-design-system.css">
    
    <style>
        /* =========================================
           CORINTHIA DIGITAL PASS
           ========================================= */
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        html, body {
            max-width: 100vw;
            overflow-x: hidden;
        }
        
        body {
            font-family: var(--font-body);
            background: var(--corinthia-haze);
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
        }
        
        .vip-invitation-card {
            max-width: 400px;
            width: 100%;
            background: var(--white);
            border: 1px solid var(--corinthia-clay);
            border-radius: 4px;
            padding: 25px;
            text-align: center;
            position: relative;
            z-index: 1;
            box-shadow: 0 10px 40px var(--anvil-shadow);
        }
        
        /* Logo */
        .card-logo {
            margin-bottom: 20px;
        }
        
        .card-logo img {
            height: 50px;
            filter: drop-shadow(0 0 10px var(--honey-glow));
        }
        
        /* Thank You Message */
        .thank-you-message {
            margin-bottom: 20px;
        }
        
        .thank-you-message h2 {
            font-family: var(--font-arabic);
            font-size: 1.3rem;
            font-weight: 400;
            color: var(--corinthia-anvil);
            margin-bottom: 5px;
        }
        
        .thank-you-message p {
            color: rgba(16, 24, 32, 0.7);
            font-size: 0.85rem;
        }
        
        /* Decorative Line */
        .decorative-line {
            width: 50px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--corinthia-honey), transparent);
            margin: 15px auto;
        }
        
        /* Reference Section */
        .reference-section {
            background: rgba(254, 163, 0, 0.08);
            border: 1px solid var(--corinthia-clay);
            border-radius: 4px;
            padding: 15px;
            margin: 15px 0;
        }
        
        .reference-label {
            font-family: var(--font-body);
            font-size: 0.7rem;
            color: var(--corinthia-honey);
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 5px;
        }
        
        .reference-number {
            font-family: var(--font-numeric);
            font-size: 1.6rem;
            font-weight: 600;
            color: var(--corinthia-anvil);
            letter-spacing: 2px;
        }
        
        /* Guest Details */
        .guest-details {
            background: rgba(254, 163, 0, 0.05);
            border: 1px solid var(--corinthia-clay);
            border-radius: 4px;
            padding: 15px;
            margin: 15px 0;
            text-align: right;
        }
        
        .guest-row {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            border-bottom: 1px solid rgba(175, 169, 160, 0.2);
        }
        
        .guest-row:last-child {
            border-bottom: none;
        }
        
        .guest-label {
            font-family: var(--font-arabic);
            font-size: 0.8rem;
            color: var(--corinthia-clay);
        }
        
        .guest-value {
            font-family: var(--font-body);
            font-size: 0.85rem;
            color: var(--corinthia-anvil);
            font-weight: 500;
        }
        
        /* Status Badge */
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            border-radius: 4px;
            font-family: var(--font-arabic);
            font-size: 0.95rem;
            margin: 15px 0;
        }
        
        .status-badge i {
            font-size: 1rem;
        }
        
        /* Timer Section */
        .timer-section {
            display: none;
            background: rgba(254, 163, 0, 0.05);
            border: 1px solid var(--corinthia-clay);
            border-radius: 4px;
            padding: 15px;
            margin: 15px 0;
        }
        
        .timer-section.active {
            display: block;
        }
        
        .timer-display {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(254, 163, 0, 0.1);
            border: 1px solid var(--corinthia-honey);
            border-radius: 4px;
            padding: 10px 20px;
            margin-top: 10px;
        }
        
        .timer-display i {
            color: var(--corinthia-honey);
        }
        
        .timer-display span {
            font-family: var(--font-numeric);
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--corinthia-anvil);
        }
        
        /* Action Buttons */
        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 20px;
        }
        
        .btn-primary {
            background: var(--corinthia-honey);
            color: var(--corinthia-anvil);
            border: 1px solid var(--corinthia-honey);
            padding: 12px 20px;
            border-radius: 4px;
            font-family: var(--font-body);
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: var(--transition);
            text-decoration: none;
        }
        
        .btn-primary:hover {
            background: var(--corinthia-anvil);
            color: var(--corinthia-honey);
            border-color: var(--corinthia-anvil);
        }
        
        .btn-secondary {
            background: transparent;
            color: var(--corinthia-anvil);
            border: 1px solid var(--corinthia-clay);
            padding: 10px 20px;
            border-radius: 4px;
            font-family: var(--font-body);
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: var(--transition);
            text-decoration: none;
        }
        
        .btn-secondary:hover {
            background: var(--corinthia-anvil);
            color: var(--white);
            border-color: var(--corinthia-anvil);
        }
        
        /* Contact Buttons */
        .contact-buttons {
            position: fixed;
            bottom: 15px;
            right: 15px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 100;
        }
        
        .contact-btn {
            width: 40px;
            height: 40px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            transition: var(--transition);
            text-decoration: none;
        }
        
        .contact-btn.phone {
            background: var(--corinthia-honey);
            color: var(--corinthia-anvil);
        }
        
        .contact-btn.whatsapp {
            background: rgba(254, 163, 0, 0.2);
            border: 1px solid var(--corinthia-honey);
            color: var(--corinthia-honey);
        }
        
        .contact-btn:hover {
            transform: scale(1.1);
        }
        
        /* Responsive */
        @media (max-width: 480px) {
            .vip-invitation-card {
                max-width: 100%;
                padding: 20px;
            }
            
            .card-logo img {
                height: 45px;
            }
            
            .thank-you-message h2 {
                font-size: 1.1rem;
            }
            
            .reference-number {
                font-size: 1.4rem;
            }
        }
    </style>
</head>
<body class="user-view">
    
    <!-- Main Card -->
    <div class="vip-invitation-card" id="mainCard">
        <!-- Logo -->
        <div class="card-logo">
            <img src="new-logo.svg" alt="Corinthia Hotel Tripoli Logo">
        </div>
        
        <!-- Thank You Message -->
        <div class="thank-you-message">
            <h2 id="mainTitle">شكراً لاختياركم كورنثيا</h2>
            <p id="mainSubtitle">تم استلام طلب الحجز بنجاح</p>
        </div>
        
        <div class="decorative-line"></div>
        
        <!-- Reference Number -->
        <div class="reference-section">
            <div class="reference-label">الرقم المرجعي</div>
            <div class="reference-number" id="reservationNumber"></div>
        </div>
        
        <!-- Guest Details -->
        <div class="guest-details">
            <div class="guest-row">
                <span class="guest-label">الاسم</span>
                <span class="guest-value" id="guestName"></span>
            </div>
            <div class="guest-row">
                <span class="guest-label">التاريخ</span>
                <span class="guest-value" id="guestDate"></span>
            </div>
            <div class="guest-row">
                <span class="guest-label">الهاتف</span>
                <span class="guest-value" id="guestPhone"></span>
            </div>
        </div>
        
        <!-- Status Badge -->
        <div class="status-badge" id="statusBadge">
            <i class="fas fa-clock" id="statusIcon"></i>
            <span id="statusText"></span>
        </div>
        
        <!-- Timer Section -->
        <div class="timer-section" id="timerSection">
            <div class="timer-display">
                <i class="fas fa-clock"></i>
                <span id="countdownDisplay"></span>
            </div>
        </div>
        
        <!-- Action Buttons -->
        <div class="action-buttons">
            <a href="check-status.html" class="btn-primary" id="primaryBtn">
                <i class="fas fa-credit-card"></i>
                <span>الانتقال للدفع</span>
            </a>
            <a href="index.html" class="btn-secondary">
                <i class="fas fa-plus"></i>
                <span>حجز جديد</span>
            </a>
        </div>
    </div>
    
    <!-- Contact Buttons -->
    <div class="contact-buttons">
        <a href="tel:+218910100708" class="contact-btn phone" title="اتصل بنا">
            <i class="fas fa-phone-alt"></i>
        </a>
        <a href="https://wa.me/218910100708" target="_blank" class="contact-btn whatsapp" title="واتساب">
            <i class="fab fa-whatsapp"></i>
        </a>
    </div>
    
    <!-- Scripts -->
    <script src="i18n.js"></script>
    <script src="success.js"></script>
</body>
</html>
