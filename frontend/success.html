<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corinthia Hotel - حجز مؤكد</title>
    
    <!-- Premium Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Luxury Design System -->
    <link rel="stylesheet" href="luxury-design-system.css">
    
    <style>
        /* =========================================
           CORINTHIA DIGITAL PASS - CORINTHIA TRIPOLI
           ========================================= */
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        html, body {
            max-width: 100vw;
            overflow-x: hidden;
            background: var(--corinthia-haze);
        }
        
        body {
            font-family: var(--font-body);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        /* Anti-Flicker: Start hidden */
        .vip-invitation-card {
            max-width: 420px;
            width: 100%;
            background: var(--white);
            border: 1px solid var(--corinthia-clay);
            border-radius: 4px;
            padding: 30px;
            text-align: center;
            position: relative;
            z-index: 1;
            box-shadow: 0 10px 50px var(--anvil-shadow);
            /* Anti-flicker: Start hidden */
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 0.5s ease-out, transform 0.5s ease-out;
        }
        
        /* Reveal class */
        .vip-invitation-card.visible {
            opacity: 1;
            transform: translateY(0);
        }
        
        /* Logo */
        .card-logo {
            margin-bottom: 25px;
        }
        
        .card-logo img {
            height: 60px;
            filter: drop-shadow(0 2px 8px var(--honey-glow));
        }
        
        /* Thank You Message */
        .thank-you-message {
            margin-bottom: 20px;
        }
        
        .thank-you-message h2 {
            font-family: var(--font-arabic);
            font-size: 1.4rem;
            font-weight: 500;
            color: var(--corinthia-anvil);
            margin-bottom: 8px;
        }
        
        .thank-you-message p {
            color: rgba(16, 24, 32, 0.7);
            font-size: 0.9rem;
        }
        
        /* Status Message */
        .status-message {
            min-height: 24px;
            margin-bottom: 15px;
            font-family: var(--font-arabic);
            font-size: 0.95rem;
            color: var(--honey-gold);
        }
        
        /* Decorative Line */
        .decorative-line {
            width: 60px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--corinthia-honey), transparent);
            margin: 20px auto;
        }
        
        /* Reference Section */
        .reference-section {
            background: rgba(255, 163, 0, 0.08);
            border: 1px solid rgba(255, 163, 0, 0.3);
            border-radius: 4px;
            padding: 18px;
            margin: 20px 0;
        }
        
        .reference-label {
            font-family: var(--font-body);
            font-size: 0.7rem;
            color: var(--corinthia-honey);
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 6px;
        }
        
        .reference-number {
            font-family: var(--font-numeric);
            font-size: 1.8rem;
            font-weight: 600;
            color: var(--corinthia-anvil);
            letter-spacing: 3px;
        }
        
        /* Guest Details - Clean Vertical Flexbox */
        .guest-details {
            background: rgba(255, 163, 0, 0.05);
            border: 1px solid var(--corinthia-clay);
            border-radius: 4px;
            padding: 18px;
            margin: 20px 0;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .guest-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(175, 169, 160, 0.2);
        }
        
        .guest-row:last-child {
            padding-bottom: 0;
            border-bottom: none;
        }
        
        .guest-label {
            font-family: var(--font-arabic);
            font-size: 0.85rem;
            color: var(--corinthia-clay);
        }
        
        .guest-value {
            font-family: var(--font-body);
            font-size: 0.9rem;
            color: var(--corinthia-anvil);
            font-weight: 500;
            text-align: right;
        }
        
        /* Status Badge */
        .status-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 12px 24px;
            border-radius: 4px;
            font-family: var(--font-arabic);
            font-size: 1rem;
            font-weight: 500;
            margin: 20px 0;
            transition: var(--transition);
        }
        
        .status-badge i {
            font-size: 1.1rem;
        }
        
        /* Status States */
        .status-pending {
            background: rgba(255, 163, 0, 0.1);
            border: 1px solid var(--corinthia-honey);
            color: var(--corinthia-anvil);
        }
        
        .status-pending i {
            color: var(--honey-gold);
        }
        
        .status-confirmed {
            background: rgba(39, 174, 96, 0.12);
            border: 1px solid #27ae60;
            color: #27ae60;
        }
        
        .status-confirmed i {
            color: #27ae60;
        }
        
        .status-cancelled {
            background: rgba(231, 76, 60, 0.12);
            border: 1px solid #e74c3c;
            color: #e74c3c;
        }
        
        .status-cancelled i {
            color: #e74c3c;
        }
        
        /* Timer Container */
        #timerContainer {
            display: none;
            margin: 20px 0;
        }
        
        #timerContainer.active {
            display: block;
        }
        
        .timer-section {
            background: rgba(255, 163, 0, 0.05);
            border: 1px solid var(--corinthia-clay);
            border-radius: 4px;
            padding: 18px;
        }
        
        .timer-label {
            font-family: var(--font-arabic);
            font-size: 0.8rem;
            color: var(--corinthia-clay);
            margin-bottom: 10px;
        }
        
        .timer-display {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: rgba(255, 163, 0, 0.1);
            border: 1px solid var(--corinthia-honey);
            border-radius: 4px;
            padding: 12px 24px;
        }
        
        .timer-display i {
            color: var(--corinthia-honey);
        }
        
        .timer-display span {
            font-family: var(--font-numeric);
            font-size: 1.3rem;
            font-weight: 600;
            color: var(--corinthia-anvil);
            min-width: 80px;
        }
        
        /* Action Buttons */
        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 35px;
            padding: 0 10px;
        }
        
        /* Base Button Styles */
        .btn-primary,
        .btn-secondary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 16px 32px;
            font-family: var(--font-body);
            font-weight: 600;
            font-size: 0.95rem;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: var(--transition);
            text-decoration: none;
            border-radius: 2px;
        }
        
        /* Primary Button - Download Receipt (Gold) */
        .btn-primary {
            background: var(--corinthia-honey);
            color: var(--white);
            border: 2px solid var(--corinthia-honey);
            box-shadow: 0 4px 15px var(--honey-glow);
        }
        
        .btn-primary:hover {
            background: #CC8200;
            border-color: #CC8200;
            box-shadow: 0 6px 25px var(--honey-glow);
            transform: translateY(-2px);
        }
        
        .btn-primary .fas {
            color: var(--white);
            font-size: 1.1em;
        }
        
        /* Secondary Button - New Booking (Ghost) */
        .btn-secondary {
            background: transparent;
            color: var(--corinthia-honey);
            border: 2px solid var(--corinthia-honey);
            box-shadow: none;
        }
        
        .btn-secondary:hover {
            background: rgba(255, 163, 0, 0.1);
            border-color: var(--corinthia-honey);
            box-shadow: none;
            transform: none;
        }
        
        .btn-secondary .fas {
            color: var(--corinthia-honey);
            font-size: 1.1em;
        }
        
        /* Contact Buttons */
        .contact-buttons {
            position: fixed;
            bottom: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 100;
        }
        
        .contact-btn {
            width: 44px;
            height: 44px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            text-decoration: none;
        }
        
        .contact-btn.phone {
            background: var(--honey-gold);
            color: var(--anvil-dark);
        }
        
        .contact-btn.whatsapp {
            background: rgba(212, 175, 55, 0.2);
            border: 1px solid var(--honey-gold);
            color: var(--honey-gold);
        }
        
        .contact-btn:hover {
            transform: scale(1.1);
        }
        
        /* Responsive */
        @media (max-width: 480px) {
            .vip-invitation-card {
                max-width: 100%;
                padding: 20px;
            }
            
            .card-logo img {
                height: 50px;
            }
            
            .thank-you-message h2 {
                font-size: 1.2rem;
            }
            
            .reference-number {
                font-size: 1.5rem;
            }
            
            .timer-display span {
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body class="user-view">
    
    <!-- Main Card -->
    <div class="vip-invitation-card" id="mainCard">
        <!-- Logo -->
        <div class="card-logo">
            <img src="new-logo.svg" alt="Corinthia Hotel Tripoli Logo">
        </div>
        
        <!-- Thank You Message -->
        <div class="thank-you-message">
            <h2 id="mainTitle">شكراً لاختياركم كورنثيا</h2>
            <p id="mainSubtitle">تم استلام طلب الحجز بنجاح</p>
        </div>
        
        <!-- Status Message -->
        <div class="status-message" id="statusMessageText"></div>
        
        <div class="decorative-line"></div>
        
        <!-- Reference Number -->
        <div class="reference-section">
            <div class="reference-label">الرقم المرجعي</div>
            <div class="reference-number" id="reservationNumber">----</div>
        </div>
        
        <!-- Guest Details - Clean Vertical Flexbox -->
        <div class="guest-details">
            <div class="guest-row">
                <span class="guest-label">الاسم</span>
                <span class="guest-value" id="guestName">----</span>
            </div>
            <div class="guest-row">
                <span class="guest-label">التاريخ</span>
                <span class="guest-value" id="guestDate">----</span>
            </div>
            <div class="guest-row">
                <span class="guest-label">الهاتف</span>
                <span class="guest-value" id="guestPhone">----</span>
            </div>
        </div>
        
        <!-- Status Badge -->
        <div class="status-badge status-pending" id="statusBadge">
            <i class="fas fa-clock" id="statusIcon"></i>
            <span id="statusText">بانتظار التأكيد</span>
        </div>
        
        <!-- Timer Container -->
        <div id="timerContainer">
            <div class="timer-section">
                <div class="timer-label">الوقت المتبقي لإتمام الحجز</div>
                <div class="timer-display">
                    <i class="fas fa-clock"></i>
                    <span id="countdownDisplay">--:--:--</span>
                </div>
            </div>
        </div>
        
        <!-- Action Buttons -->
        <div class="action-buttons">
            <a href="check-status.html" class="btn-primary" id="primaryBtn">
                <i class="fas fa-credit-card"></i>
                <span>الانتقال للدفع</span>
            </a>
            <a href="index.html" class="btn-secondary">
                <i class="fas fa-plus"></i>
                <span>حجز جديد</span>
            </a>
        </div>
    </div>
    
    <!-- Contact Buttons -->
    <div class="contact-buttons">
        <a href="tel:+218910100708" class="contact-btn phone" title="اتصل بنا">
            <i class="fas fa-phone-alt"></i>
        </a>
        <a href="https://wa.me/218910100708" target="_blank" class="contact-btn whatsapp" title="واتساب">
            <i class="fab fa-whatsapp"></i>
        </a>
    </div>
    
    <!-- Scripts -->
    <script src="i18n.js"></script>
    <script src="success.js"></script>
</body>
</html>
