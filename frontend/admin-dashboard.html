<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم | Corinthia Hotel Tripoli</title>
    
    <!-- Luxury Design System -->
    <link rel="stylesheet" href="luxury-design-system.css">
    
    <link rel="stylesheet" href="vendor/fonts/fonts.css">
    
    <link rel="stylesheet" href="vendor/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="vendor/flatpickr/flatpickr.min.css">
    <script src="vendor/flatpickr/flatpickr.min.js"></script>
    <script src="vendor/flatpickr/l10n/ar.js"></script>
    <script src="vendor/xlsx/xlsx.full.min.js"></script>
    <script src="vendor/chartjs/chart.umd.min.js"></script>
    
    <link rel="stylesheet" href="admin-style.css">
</head>

<body class="admin-view">

    <nav class="admin-nav">
        <div class="brand">
            <div class="logo-container">
                <img src="new-logo.svg" alt="Corinthia Hotel Tripoli Logo" style="height: 50px; filter: drop-shadow(0 0 10px rgba(254, 163, 0, 0.5));">
            </div>
            
            <div class="brand-text">
                <h1 class="hotel-name">CORINTHIA</h1>
                <p class="panel-name" data-i18n="admin_panel">لوحة التحكم والإدارة</p>
            </div>
        </div>
        
        <div class="nav-actions">
            <a id="archiveNavLink" href="archives.html" target="_blank" class="archive-btn" style="text-decoration: none; margin-left: 10px; background: linear-gradient(135deg, #7f8c8d, #95a5a6); padding: 10px 15px; border-radius: 2px; color: white; display: none; align-items: center; gap: 8px;">
                <i class="fas fa-folder-open"></i>
                <span data-i18n="restaurant_archives">أرشيف المطعم</span>
            </a>
            <a id="usersManagementLink" href="users-management.html" class="logout-btn" style="text-decoration: none; margin-left: 10px; display: none;">
                <i class="fas fa-users"></i> 
                <span data-i18n="users_management">إدارة المستخدمين</span>
            </a>
            <button id="langToggle" class="lang-switch-text" data-action="i18n.toggleLang">
                <span class="lang-text">English</span>
            </button>
            
            <button class="logout-btn" data-action="logout">
                <i class="fas fa-sign-out-alt"></i> 
                <span data-i18n="logout">تسجيل الخروج</span>
            </button>
        </div>
    </nav>

    <main class="dashboard-content">
        
        <div class="stats-grid">
            <div class="stat-card">
                <h3 data-i18n="total_bookings">إجمالي الحجوزات</h3>
                <div id="totalCount" class="value">0</div>
                <div class="card-icon-bg"><i class="fas fa-calendar-check"></i></div>
            </div>
            
            <div class="stat-card border-confirmed">
                <h3 data-i18n="confirmed_bookings">تم التأكيد</h3>
                <div id="confirmedCount" class="value">0</div>
                <div class="card-icon-bg"><i class="fas fa-user-check"></i></div>
            </div>
            
            <div class="stat-card border-pending">
                <h3 data-i18n="pending_bookings">قيد الانتظار</h3>
                <div id="pendingCount" class="value">0</div>
                <div class="card-icon-bg"><i class="fas fa-clock"></i></div>
            </div>
        </div>

        <!-- Analytics Dashboard Section -->
        <div class="analytics-grid">
            <!-- Status Distribution Card -->
            <div class="analytics-card dark-theme">
                <h3 data-i18n="status_distribution">Status Distribution</h3>
                <div class="chart-container">
                    <canvas id="statusDistributionChart"></canvas>
                </div>
            </div>
            
            <!-- Weekly Trends Card -->
            <div class="analytics-card dark-theme">
                <h3 data-i18n="weekly_trends">Weekly Trends</h3>
                <div class="chart-container">
                    <canvas id="weeklyTrendsChart"></canvas>
                </div>
            </div>
            
            <!-- Capacity Overview Card -->
            <div class="analytics-card dark-theme capacity-card">
                <h3 data-i18n="booking_capacity">Booking Capacity</h3>
                <div id="capacityBarsContainer" class="capacity-bars-container">
                    <p style="color: #888; text-align: center;"><i class="fas fa-circle-notch fa-spin"></i> Loading data...</p>
                </div>
            </div>
        </div>

        <div class="admin-tools-container">
            <div class="search-wrapper">
                <i class="fas fa-search search-icon"></i>
                <input type="text" id="searchInput" 
                       placeholder="RMD12345" 
                       maxlength="10" pattern="[A-Za-z0-9\-]*"
                       autocomplete="off"
                       data-on-input="cleanSearchInput" data-pass="element">
            </div>

            <div class="controls-group">
                <div class="date-range-container">
                    <i class="fas fa-calendar-alt"></i>
                    <input type="text" id="dateRangePicker" class="flatpickr-input" data-i18n-attr="placeholder:select_date_range">
                </div>
                
                <button data-action="resetFilter" class="action-btn secondary-gold" title="Reset">
                    <i class="fas fa-sync-alt"></i>
                </button>

                <button data-action="exportToExcel" class="action-btn excel-green">
                    <i class="fas fa-file-excel"></i>
                    <span>Export Excel</span>
                </button>
            </div>
        </div>

        <div class="table-container">
            <div class="admin-table-wrapper">
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th data-i18n="col_id">المعرف</th>
                            <th data-i18n="col_guest">معلومات الضيف</th>
                            <th data-i18n="col_date">تاريخ الحجز</th>
                            <th data-i18n="col_guests">الأفراد</th>
                            <th data-i18n="col_status">الحالة</th>
                            <th data-i18n="col_action">الإجراءات</th>
                        </tr>
                    </thead>
                    <tbody id="adminTableBody">
                        <tr>
                            <td colspan="6" style="text-align:center; padding:50px; color:#999;">
                                <i class="fas fa-circle-notch fa-spin"></i> <span data-i18n="syncing">جاري المزامنة...</span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
            
            <div id="adminPagination" class="pagination"></div>
        </div>

    </main>

    <script src="actions.js"></script>

    <script src="constants.js"></script>
    <script src="i18n.js"></script>
    <script src="admin-dash.js"></script>

</body>
</html>
