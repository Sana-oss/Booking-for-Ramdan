<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تم التأكيد | فندق كورنثيا</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Cinzel:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="user-view">

    <div class="hero-bg"></div>

    <div class="main-wrapper">
        <div class="luxury-card">
            <div class="success-icon">
                <i class="fas fa-check-circle"></i>
            </div>
            
            <h1 data-i18n="success_title">تم تسجيل طلبكم</h1>
            <p class="subtitle" data-i18n="success_desc">يسعدنا استضافتكم في فندق كورنثيا طرابلس</p>

            <div class="res-box">
                <span style="color: var(--gold); font-size: 0.85rem;" data-i18n="res_num_label">رقم الحجز المرجعي</span>
                <div id="reservationNumber" style="margin: 15px 0; font-family: 'Cinzel', serif;">جاري جلب الرقم...</div>
                
                <button id="copyBtn" onclick="copyResNumber()" class="btn-outline-gold" style="font-size: 0.75rem; padding: 6px 15px;">
                    <i class="fas fa-copy"></i> <span data-i18n="copy_btn">نسخ رقم الحجز</span>
                </button>
            </div>

            <p style="font-size: 0.85rem; color: #aaa; margin-bottom: 25px;" data-i18n="success_note">يرجى تصوير الشاشة أو نسخ الرقم لمتابعته لاحقاً.</p>

            <div style="display: flex; flex-direction: column; gap: 12px;">
                <a href="index.html" class="btn-gold" style="text-decoration: none;" data-i18n="new_booking">حجز جديد</a>
                <a href="check-status.html" style="color: var(--gold); text-decoration: none; font-size: 0.9rem;" data-i18n="follow_up">متابعة حالة الحجز</a>
            </div>
        </div>
    </div>

    <div class="floating-contact">
        <a href="tel:+218910100708" class="contact-item ph-btn">
            <i class="fas fa-phone-alt"></i>
        </a>
        <a href="https://wa.me/218943351990" target="_blank" class="contact-item wa-btn">
            <i class="fab fa-whatsapp"></i>
        </a>
    </div>

    <script src="constants.js"></script>
    <script src="i18n.js"></script>
    <script src="success.js"></script>
</body>
</html>
