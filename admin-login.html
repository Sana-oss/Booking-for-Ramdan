<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول | إدارة كورنثيا</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Cinzel:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="auth.css">
</head>

<body class="user-view">
    
    <button id="langToggle" class="lang-toggle-btn" onclick="i18n.toggleLang()">EN</button>

    <div class="booking-container">
        <div class="logo-container">
            <img src="https://upload.wikimedia.org/wikipedia/en/thumb/d/d3/Corinthia_Hotels_logo.svg/1200px-Corinthia_Hotels_logo.svg.png" 
                 alt="Corinthia Logo">
        </div>

        <h1 data-i18n="admin_login_title">بوابة الموظفين</h1>
        <p data-i18n="admin_login_subtitle">الرجاء تسجيل الدخول للوصول إلى لوحة التحكم</p>

        <form id="adminLoginForm">
            <div class="form-group">
                <label data-i18n="label_username">اسم المستخدم</label>
                <div>
                    <i class="fas fa-user"></i>
                    <input type="text" id="adminUser" placeholder="أدخل اسم المستخدم" required autocomplete="username">
                </div>
            </div>

            <div class="form-group">
                <label data-i18n="label_password">كلمة المرور</label>
                <div>
                    <i class="fas fa-lock"></i>
                    <input type="password" id="adminPass" placeholder="أدخل كلمة المرور" required autocomplete="current-password">
                </div>
            </div>

            <div id="loginErrorMessage" data-i18n="error_login">
                خطأ في اسم المستخدم أو كلمة المرور
            </div>

            <button type="submit" class="submit-btn" id="loginSubmitBtn">
                <span class="btn-text" data-i18n="btn_login">دخول آمن</span>
                <span class="btn-spinner"></span>
                <i class="fas fa-shield-alt"></i>
            </button>
        </form>

        <a href="index.html">
            <i class="fas fa-arrow-right"></i> <span data-i18n="back_to_site">العودة للموقع</span>
        </a>
    </div>

    <script src="constants.js"></script>
    <script src="i18n.js"></script>
    <script src="admin-login.js"></script>
</body>
</html>
