<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فندق كورنثيا | حجز الإفطار الفاخر</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;700&family=Cinzel:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="user-view">

    <div class="hero-bg"></div>

    <div class="lang-switcher">
        <button id="langToggle" class="btn-outline-gold" onclick="i18n.toggleLang()">
            EN
        </button>
    </div>

    <div class="main-wrapper">
        <div class="luxury-card">
            <div class="logo-container">
                <img src="https://upload.wikimedia.org/wikipedia/en/thumb/d/d3/Corinthia_Hotels_logo.svg/1200px-Corinthia_Hotels_logo.svg.png" alt="Corinthia Logo" class="hotel-logo">
            </div>

            <h1 data-i18n="title_home">تجربة إفطار ملكية</h1>
            <p class="subtitle" data-i18n="subtitle_home">أهلاً بكم في قلب الفخامة بمدينة طرابلس</p>
            
            <form id="bookingForm">
                
                <div class="input-group">
                    <label data-i18n="label_name">الاسم الكامل</label>
                    <input type="text" id="name" class="luxury-input" placeholder="أدخل اسمك كما في الهوية" required>
                </div>

                <div class="input-group">
                    <label data-i18n="label_phone">رقم الهاتف</label>
                    <input type="tel" id="phone" class="luxury-input" placeholder="+218 --- ---" required>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                    <div class="input-group">
                        <label data-i18n="label_date">تاريخ الحجز</label>
                        <input type="date" id="date" class="luxury-input" required>
                    </div>
                    <div class="input-group">
                        <label data-i18n="label_people">عدد الضيوف</label>
                        <input type="number" id="guests" class="luxury-input" min="1" max="20" value="1" required>
                    </div>
                </div>

                <div class="group-option">
                    <input type="checkbox" id="isGroup">
                    <label for="isGroup" data-i18n="group_booking">هذا حجز لمجموعة كبيرة / مناسبة خاصة</label>
                </div>

                <button type="submit" id="submitBtn" class="btn-gold">
                    <span data-i18n="submit_booking">تأكيد الحجز الفاخر</span>
                </button>
            </form>
            
            <div style="margin-top: 25px;">
                <a href="check-status.html" style="text-decoration: none; color: var(--gold); font-size: 0.9rem; border-bottom: 1px solid var(--gold); padding-bottom: 3px;" data-i18n="follow_up">
                    متابعة حالة حجز سابق
                </a>
            </div>
        </div>
    </div>

    <div class="floating-contact">
        <a href="tel:+218910100708" class="contact-item ph-btn">
            <i class="fas fa-phone-alt"></i>
        </a>
        <a href="https://wa.me/218943351990" target="_blank" class="contact-item wa-btn">
            <i class="fab fa-whatsapp"></i>
        </a>
    </div>

    <script src="constants.js"></script>
    <script src="i18n.js"></script>
    <script src="ui.js"></script>
    <script src="validation.js"></script>
    <script src="script.js"></script>
</body>
</html>
