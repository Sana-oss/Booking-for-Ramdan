<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="hotelName">فندق كورنثيا | حجز الإفطار</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Cinzel:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="main.css">
</head>
<body class="user-view">

    <div class="lang-switcher-wrapper">
        <button onclick="i18n.toggleLang()" class="btn-lang-pill">
            <span id="langText">EN</span>
        </button>
    </div>

    <div class="luxury-card">
        <div class="logo-area">
            <img src="logo.png" class="hotel-logo-img" alt="Corinthia Logo">
        </div>

        <h1 data-i18n="title_home">تجربة إفطار ملكية</h1>
        <p class="subtitle" data-i18n="subtitle_home">أهلاً بكم في قلب الفخامة بمدينة طرابلس</p>

        <form id="bookingForm">
            <div class="input-group">
                <label data-i18n="label_name">الاسم الكامل</label>
                <input type="text" id="name" class="pill-input" required placeholder="أدخل اسمك الثلاثي">
            </div>

            <div class="input-row">
                <div class="input-group" style="flex: 1.5;">
                    <label data-i18n="label_phone">رقم الهاتف</label>
                    <input type="tel" id="phone" class="pill-input" placeholder="+218 -- --- ----" required>
                </div>
                <div class="input-group" style="flex: 1;">
                    <label data-i18n="label_date">التاريخ</label>
                    <input type="date" id="date" class="pill-input" required>
                </div>
            </div>

            <div class="input-group">
                <label data-i18n="label_people">عدد الضيوف</label>
                <input type="number" id="guests" class="pill-input" min="1" max="20" value="2" required>
            </div>

            <div class="group-option-pill">
                <label class="switch">
                    <input type="checkbox" id="isGroup">
                    <span class="slider"></span>
                </label>
                <span data-i18n="group_booking" style="color: var(--gold);">حجز لمجموعة / مناسبة</span>
            </div>

            <button type="submit" class="btn-gold-pill" id="submitBtn">
                <span id="btnText" data-i18n="submit_booking">تأكيد حجز طاولة</span>
                <i class="fas fa-paper-plane" id="btnIcon"></i>
            </button>
        </form>

        <a href="check-status.html" class="status-link">
            <i class="fas fa-search"></i>
            <span data-i18n="follow_up">متابعة حالة الحجز</span>
        </a>
    </div>

    <div class="floating-contact">
        <a href="tel:+218910100708" class="contact-item ph-btn"><i class="fas fa-phone-alt"></i></a>
        <a href="https://wa.me/218943351990" target="_blank" class="contact-item wa-btn"><i class="fab fa-whatsapp"></i></a>
    </div>

    <script src="constants.js"></script>
    <script src="i18n.js"></script>
    <script src="script.js"></script>
</body>
</html>
